authoring:
  sparklines:
    hierarchy:
      item_root:
      - entity_index
      - xpos
      - ypos
      - width
      - height
      - margin
      - period
      - x_axis
      - y_axis
      - series
      - sparkline
      graph_block: All graph rendering families and graph show selectors live under sparkline:.
      do_not_place_at_root:
      - show
      - line
      - area
      - bar
      - dots
      - equalizer
      - graded
      - barcode
      - state_bands
      - radial
      - radial_barcode
      - color_stops
    minimal_example:
      entity_index: 0
      period:
        type: rolling_window
        rolling_window:
          duration:
            hour: 24
      sparkline:
        show:
          chart_type: area
          line: true
        area:
          styles:
            opacity: 0.25
    duration: 'Current runtime consumes duration.hour only. Use hour: 24 for one day, not day: 1.'
    chart_types:
    - line
    - area
    - bar
    - dots
    - equalizer
    - state_bands
    - graded
    - barcode
    - radial
    - radial_barcode
    chart_type_rule: sparkline.show.chart_type is the primary discriminator and selects sparkline.<chart_type> 
      configuration.
    radial:
      variant_rule: For chart_type radial, sparkline.show.chart_variant must be line, area or dots.
      geometry: Configure shared radial geometry at parent sparkline.radial.
    radial_barcode:
      chart_variant:
      - fixed
      - sunburst
      - sunburst_centered
      - sunburst_outward
      - sunburst_inward
      chart_viz:
      - bar
      - flower
      - flower2
      - rice_grain
    axes:
      independent_toggles:
      - show.grid.x/y
      - show.axis.x/y
      - show.tickmarks.x/y
      - show.labels.x/y
      important: labels/tickmarks/grid do not require show.axis to be true. Each layer is toggled independently.
      availability:
        x_and_y:
        - line
        - area
        - bar
        - dots
        - equalizer
        - state_bands
        - radial
        x_only:
        - barcode
        - radial_barcode
        none:
        - graded
      config_blocks: x_axis and y_axis style/configure available axis layers; they do not enable them.
    show:
      line: Controls the line layer for compatible line/area/radial variants.
      points: Adds point geometry; line.show_dots and area.show_dots can also activate dots.
      fill:
      - solid
      - fade
      legend: Activates sparkline.legend and reserves graph area.
      day_night: Requires calendar/rolling_window; not real_time. Positive future calendar offset is unsupported.
      area_warning: 'Do not use show.area. Current runtime selects the area surface through chart_type: area; v10 exposed
        show.area but runtime does not consume it.'
    series:
      nesting: Per-series graph overrides also live under series[].sparkline, not at series root.
      required:
      - id
      - entity_index
      chart_types:
      - line
      - area
      - dots
      - bar
      - radial
      inheritance: Each explicit series deep-merges over the complete parent sparkline configuration.
      period_override: A series may override only offset inside the active calendar/rolling_window period branch.
      y_axis_id:
      - primary
      - secondary
      radial: Radial series cannot mix with cartesian series; parent chart_type must be radial and shared radial 
        geometry stays on the parent.
    selector_matrix:
      line:
        chart_variant: omit
        chart_viz: omit
      area:
        chart_variant: omit
        chart_viz: omit
      bar:
        chart_variant: omit
        chart_viz: omit
      dots:
        chart_variant: omit
        chart_viz: omit
      equalizer:
        chart_variant: omit
        chart_viz: omit
      state_bands:
        chart_variant: omit
        chart_viz: omit
      barcode:
        chart_variant:
        - audio
        - stalactites
        - stalagmites
        chart_viz: omit
      graded:
        chart_variant:
        - rank_order
        chart_viz: omit
      radial:
        chart_variant:
        - line
        - area
        - dots
        chart_viz: omit
      radial_barcode:
        chart_variant:
        - fixed
        - sunburst
        - sunburst_centered
        - sunburst_outward
        - sunburst_inward
        chart_viz:
        - bar
        - flower
        - flower2
        - rice_grain
    selector_rule: chart_variant and chart_viz are not universal selectors. If the selected chart_type does not define a
      selector, omit the field entirely. Never invent placeholder values such as default, none or standard.
    barcode:
      chart_variant:
      - audio
      - stalactites
      - stalagmites
      chart_viz: omit
    graded:
      chart_variant:
      - rank_order
      chart_viz: omit
generation:
  reuse_overrides:
    sparkline:
      exclude_properties:
      - color_stops
      - colorstop
      - colorstopinterpolated
      - colorstopsegments
      - show
      properties:
        group:
          description: 'Layout group that owns this item. Group-local authoring is centered on 50,50: item 50,50 produces
            no offset and appears at the group position; values above or below 50 move relative to that group center.'
          x-fhs-semantic-source: schema-context-v8
        period:
          $ref: layout.sparklinePeriod
          description: History period/window configuration for this sparkline or series.
          x-fhs-semantic-source: schema-context-v8

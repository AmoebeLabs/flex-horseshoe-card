namespace: layout
definitions:
  gradients:
    type: object
    additionalProperties:
      $ref: layout.gradient
    description: Public FHS schema definition for layout gradients.
    x-fhs-semantic-source: schema-semantic-pass-v8
  gradient:
    type: object
    properties:
      type:
        oneOf:
          - const: linear
            description: Linear SVG gradient.
          - const: radial
            description: Radial SVG gradient.
        default: linear
        description: 'SVG gradient type: linear or radial.'
        x-fhs-semantic-source: runtime-or-schema-verified-v8
      gradientUnits:
        oneOf:
          - const: objectBoundingBox
            description: Coordinates are percentages of the painted object.
          - const: userSpaceOnUse
            description: Coordinates use the card SVG coordinate system.
        default: objectBoundingBox
        description: SVG gradient coordinate system. With objectBoundingBox, numeric FHS coordinates are 
          interpreted as percentages 0..100 of the painted object (50 means 50%, not 0.5). With 
          userSpaceOnUse, numeric coordinates use normal FHS logical dimensions and are converted to the 
          internal SVG viewBox.
        x-fhs-semantic-source: runtime-verified-v11
      x1:
        anyOf:
          - type: number
          - type: string
        description: x1 gradient coordinate. Numeric values use FHS 0..100 percentage semantics with 
          objectBoundingBox; with userSpaceOnUse they use normal FHS logical dimensions. Percentage strings 
          are passed through.
        x-fhs-semantic-source: runtime-verified-v11
      y1:
        anyOf:
          - type: number
          - type: string
        description: y1 gradient coordinate. Numeric values use FHS 0..100 percentage semantics with 
          objectBoundingBox; with userSpaceOnUse they use normal FHS logical dimensions. Percentage strings 
          are passed through.
        x-fhs-semantic-source: runtime-verified-v11
      x2:
        anyOf:
          - type: number
          - type: string
        description: x2 gradient coordinate. Numeric values use FHS 0..100 percentage semantics with 
          objectBoundingBox; with userSpaceOnUse they use normal FHS logical dimensions. Percentage strings 
          are passed through.
        x-fhs-semantic-source: runtime-verified-v11
      y2:
        anyOf:
          - type: number
          - type: string
        description: y2 gradient coordinate. Numeric values use FHS 0..100 percentage semantics with 
          objectBoundingBox; with userSpaceOnUse they use normal FHS logical dimensions. Percentage strings 
          are passed through.
        x-fhs-semantic-source: runtime-verified-v11
      cx:
        anyOf:
          - type: number
          - type: string
        description: cx gradient coordinate. Numeric values use FHS 0..100 percentage semantics with 
          objectBoundingBox; with userSpaceOnUse they use normal FHS logical dimensions. Percentage strings 
          are passed through.
        x-fhs-semantic-source: runtime-verified-v11
      cy:
        anyOf:
          - type: number
          - type: string
        description: cy gradient coordinate. Numeric values use FHS 0..100 percentage semantics with 
          objectBoundingBox; with userSpaceOnUse they use normal FHS logical dimensions. Percentage strings 
          are passed through.
        x-fhs-semantic-source: runtime-verified-v11
      r:
        anyOf:
          - type: number
          - type: string
        description: r gradient coordinate. Numeric values use FHS 0..100 percentage semantics with 
          objectBoundingBox; with userSpaceOnUse they use normal FHS logical dimensions. Percentage strings 
          are passed through.
        x-fhs-semantic-source: runtime-verified-v11
      stops:
        type: array
        items:
          $ref: layout.gradientStop
        description: Ordered SVG gradient/fade stops.
        x-fhs-semantic-source: schema-context-v8
    additionalProperties: false
    description: Named SVG linear/radial gradient definition consumed from styles with gradient(name), not 
      with a raw unscoped url(#name).
    x-fhs-semantic-source: runtime-verified-v11
  gradientStop:
    type: object
    properties:
      offset:
        anyOf:
          - type: number
          - type: string
        description: Gradient stop offset. A numeric value is interpreted as a percentage from 0 through 100 
          and rendered as '<value>%'; a string is passed through to SVG.
        x-fhs-semantic-source: runtime-verified-v11
      color:
        type: string
        description: Color value used by this stop, gradient, scale or marker.
        x-fhs-semantic-source: schema-context-v8
      opacity:
        type: number
        minimum: 0
        maximum: 1
        default: 1
        description: Opacity from 0 (transparent) to 1 (opaque).
        x-fhs-semantic-source: schema-context-v8
        x-fhs-unit: ratio-0-1
    required:
      - offset
    additionalProperties: false
    description: Public FHS schema definition for layout gradientStop.
    x-fhs-semantic-source: schema-semantic-pass-v8

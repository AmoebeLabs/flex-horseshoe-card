namespace: card
definitions:
  layout:
    type: object
    properties:
      aspectratio:
        $ref: layout.aspectratio
        description: Width/height aspect ratio. The normal 1/1 logical card is 100 x 100; an aspect ratio 2/1 produces a 200
          x 100 logical canvas while retaining the same 100-unit reference scale.
        x-fhs-semantic-source: schema-context-v8
      groups:
        $ref: layout.groups
        description: Local coordinate/transform groups.
        x-fhs-semantic-source: schema-context-v8
      compounds:
        $ref: layout.compounds
        description: Compound collections of layout tools.
        x-fhs-semantic-source: schema-context-v8
      gradients:
        $ref: layout.gradients
        description: Named SVG gradients.
        x-fhs-semantic-source: schema-context-v8
      clips:
        $ref: layout.clips
        description: Named clip-path definitions.
        x-fhs-semantic-source: schema-context-v8
      masks:
        $ref: layout.masks
        description: Named mask definitions.
        x-fhs-semantic-source: schema-context-v8
      horseshoes:
        $ref: layout.horseshoes
        description: Current horseshoe/progress gauge items.
        x-fhs-semantic-source: schema-context-v8
      horseshoes_v2:
        $ref: layout.horseshoes_v2
        description: Compatibility alias for horseshoe items.
        x-fhs-semantic-source: schema-context-v8
      states:

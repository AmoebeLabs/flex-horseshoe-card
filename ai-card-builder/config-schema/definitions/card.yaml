root: true
schema:
  title: Flexible Horseshoe Card public configuration
  description: 'Public Flexible Horseshoe Card configuration contract plus authoring semantics and non-validating
    functional relationship metadata. v12 closes interpretation gaps found by AI authoring tests: FHS-local entities,
    JavaScript template context, sparkline selector applicability, slider interaction/scale semantics, SVG styling
    boundaries, and explicit final validation guidance.'
  x-fhs-source:
    repository: AmoebeLabs/flex-horseshoe-card
    branch: master
    commit: 429273b63c880607f984b8e2eef62067ba8dc843
    version: 5.4.7-dev.32
  type: object
  properties:
    type:
      type: string
      const: custom:flex-horseshoe-card
      description: Root-level FHS `type` configuration.
      x-fhs-semantic-source: schema-context-v8
    template:
      $ref: card.templateUse
      description: Template reference merged into this configuration before normal runtime use.
      x-fhs-semantic-source: schema-context-v8
    embedded:
      type: boolean
      description: Marks the card as embedded in another FHS/card context where supported.
      x-fhs-semantic-source: schema-context-v8
    entities:
      $ref: card.entities
      description: Root-level FHS `entities` configuration.
      x-fhs-semantic-source: schema-context-v8
    layout:
      $ref: card.layout
      description: Root-level FHS `layout` configuration.
      x-fhs-semantic-source: schema-context-v8
    constants:
      $ref: card.constants
      description: Card-level constants reusable through ref(name) and calc(expression).
      x-fhs-semantic-source: schema-context-v8
    styles:
      $ref: card.styles
      description: SVG/CSS style configuration for this item. In FHS text rendering the normal base font is 12
        internal SVG units, equivalent to about 6 logical units on the standard 100-unit card; therefore 1em 
        is approximately 6 logical units.
      x-fhs-semantic-source: schema-context-v8
    color_filter:
      $ref: card.colorFilter
      description: Optional FHS color-filter configuration applied in the normal card/group/item filter 
        cascade.
      x-fhs-semantic-source: schema-context-v8
    palettes:
      $ref: card.palettes
      description: Card-level palette definitions/references.
      x-fhs-semantic-source: schema-context-v8
    animations:
      $ref: card.animations
      description: Card-level animation definitions.
      x-fhs-semantic-source: schema-context-v8
    cards:
      $ref: card.cards
      description: Nested/child card definitions positioned by the parent FHS card.
      x-fhs-semantic-source: schema-context-v8
    dev:
      $ref: card.dev
      description: Root-level FHS `dev` configuration.
      x-fhs-semantic-source: schema-context-v8
    aspectratio:
      $ref: common.aspectRatio
      deprecated: true
      x-fhs-prefer: layout.aspectratio
      description: Width/height aspect ratio. The normal 1/1 logical card is 100 x 100; an aspect ratio 2/1 
        produces a 200 x 100 logical canvas while retaining the same 100-unit reference scale.
      x-fhs-semantic-source: schema-context-v8
    card_filter:
      description: Card-level filter configuration retained for compatibility where supported.
      x-fhs-semantic-source: schema-context-v8
    entity_index:
      $ref: common.entityIndex
      deprecated: true
      x-fhs-prefer: layout.horseshoes[].entity_index
      x-fhs-legacy-scope: root-horseshoe
      description: Index or named entity slot selecting one configured card entity for this item.
      x-fhs-semantic-source: schema-context-v8
    show:
      type: object
      deprecated: true
      additionalProperties: true
      x-fhs-prefer: layout.horseshoes[].show
      x-fhs-legacy-scope: root-horseshoe
      description: Visibility/mode selectors for this tool. Exact supported keys are tool-specific.
      x-fhs-semantic-source: schema-context-v8
    horseshoe_position:
      type: object
      deprecated: true
      additionalProperties: true
      x-fhs-prefer: layout.horseshoes[].horseshoe_position
      x-fhs-legacy-scope: root-horseshoe
      description: Horseshoe-specific position configuration retained inside the horseshoe tool.
      x-fhs-semantic-source: schema-context-v8
    horseshoe_scale:
      $ref: layout.horseshoeScale
      deprecated: true
      x-fhs-prefer: layout.horseshoes[].horseshoe_scale
      x-fhs-legacy-scope: root-horseshoe
      description: Scale/range configuration used to interpret entity values along this horseshoe.
      x-fhs-semantic-source: schema-context-v8
    horseshoe_state:
      type: object
      deprecated: true
      additionalProperties: true
      x-fhs-prefer: layout.horseshoes[].horseshoe_state
      x-fhs-legacy-scope: root-horseshoe
      description: State/progress rendering configuration for this horseshoe.
      x-fhs-semantic-source: schema-context-v8
    horseshoe_marker:
      $ref: layout.horseshoeMarker
      deprecated: true
      x-fhs-prefer: layout.horseshoes[].horseshoe_marker
      x-fhs-legacy-scope: root-horseshoe
      description: Optional marker rendered on/around the horseshoe path.
      x-fhs-semantic-source: schema-context-v8
    horseshoe_background:
      type: object
      deprecated: true
      additionalProperties: true
      x-fhs-prefer: layout.horseshoes[].horseshoe_background
      x-fhs-legacy-scope: root-horseshoe
      description: Background rendering configuration for the horseshoe.
      x-fhs-semantic-source: schema-context-v8
    horseshoe_labels:
      type: object
      deprecated: true
      additionalProperties: true
      x-fhs-prefer: layout.horseshoes[].horseshoe_labels
      x-fhs-legacy-scope: root-horseshoe
      description: Label rendering configuration for the horseshoe.
      x-fhs-semantic-source: schema-context-v8
    horseshoe_tickmarks:
      type: object
      deprecated: true
      additionalProperties: true
      x-fhs-prefer: layout.horseshoes[].horseshoe_tickmarks
      x-fhs-legacy-scope: root-horseshoe
      description: Tickmark rendering configuration for the horseshoe.
      x-fhs-semantic-source: schema-context-v8
    color_stops:
      $ref: common.colorStops
      deprecated: true
      x-fhs-prefer: layout.horseshoes[].color_stops
      x-fhs-legacy-scope: root-horseshoe
      description: FHS color-stop definition used to map numeric or string entity states to colors and 
        optional styles.
      x-fhs-semantic-source: schema-context-v8
    colorstops:
      type: object
      deprecated: true
      additionalProperties: true
      x-fhs-prefer: layout.horseshoes[].color_stops
      x-fhs-legacy-scope: root-horseshoe
      description: Normalized/runtime color-stop representation. Prefer public color_stops in authored YAML 
        unless this field is explicitly documented for the containing feature.
      x-fhs-semantic-source: schema-context-v8
    bar_mode:
      deprecated: true
      x-fhs-prefer: layout.horseshoes[].bar_mode
      x-fhs-legacy-scope: root-horseshoe
      description: Horseshoe progress interpretation mode, including normal and bidirectional variants.
      x-fhs-semantic-source: schema-context-v8
    radius:
      deprecated: true
      x-fhs-prefer: layout.horseshoes[].radius
      x-fhs-legacy-scope: root-horseshoe
      description: Radius used by this object. See the containing tool description for whether it is a normal 
        FHS logical dimension or a legacy/raw SVG value.
      x-fhs-semantic-source: schema-context-v8
    tickmarks_radius:
      deprecated: true
      x-fhs-prefer: layout.horseshoes[].tickmarks_radius
      x-fhs-legacy-scope: root-horseshoe
      description: Radius used for horseshoe tickmark placement on the normal FHS logical scale.
      x-fhs-semantic-source: schema-context-v8
    arc_degrees:
      deprecated: true
      x-fhs-prefer: layout.horseshoes[].arc_degrees
      x-fhs-legacy-scope: root-horseshoe
      description: Angular extent in degrees. Positive and negative values follow the direction conventions of
        the containing tool.
      x-fhs-semantic-source: schema-context-v8
    start_angle:
      deprecated: true
      x-fhs-prefer: layout.horseshoes[].start_angle
      x-fhs-legacy-scope: root-horseshoe
      description: Starting angle in degrees for the path or gauge.
      x-fhs-semantic-source: schema-context-v8
    rotate:
      deprecated: true
      x-fhs-prefer: layout.horseshoes[].rotate
      x-fhs-legacy-scope: root-horseshoe
      description: Rotation in degrees.
      x-fhs-semantic-source: schema-context-v8
    flip:
      deprecated: true
      x-fhs-prefer: layout.horseshoes[].flip
      x-fhs-legacy-scope: root-horseshoe
      description: Optional horizontal and/or vertical mirroring of the rendered item.
      x-fhs-semantic-source: schema-context-v8
    xpos:
      deprecated: true
      x-fhs-prefer: layout.horseshoes[].xpos
      x-fhs-legacy-scope: root-horseshoe
      description: 'Horizontal position in FHS logical coordinates. A 1/1 card uses a 100-unit reference width:
        0 is the left edge, 50 the center and 100 the right edge. Inside a group, 50 is the neutral local position:
        final_x = group.xpos + item.xpos - 50.'
      x-fhs-semantic-source: schema-context-v8
    ypos:
      deprecated: true
      x-fhs-prefer: layout.horseshoes[].ypos
      x-fhs-legacy-scope: root-horseshoe
      description: 'Vertical position in FHS logical coordinates. A 1/1 card uses a 100-unit reference height: 0
        is the top edge, 50 the center and 100 the bottom edge. Inside a group, 50 is the neutral local position:
        final_y = group.ypos + item.ypos - 50.'
      x-fhs-semantic-source: schema-context-v8
    yposc:
      deprecated: true
      x-fhs-prefer: layout.horseshoes[].yposc
      x-fhs-legacy-scope: root-horseshoe
      description: Alternative vertical centre coordinate used by current FHS runtime. It uses the same 
        100-unit logical and group-local coordinate rules as ypos.
      x-fhs-semantic-source: schema-context-v8
  additionalProperties: false
  x-fhs-schema-release: interpretation-gaps-v12
  x-fhs-authoring:
    coordinate_system:
      name: FHS logical coordinate system
      standard_card: A 1/1 card is authored as a 100 x 100 logical canvas.
      origin: 0,0 is the top-left of the logical card; x grows right and y grows down.
      center:
        - 50
        - 50
      edges:
        left_x: 0
        right_x: 100
        top_y: 0
        bottom_y: 100
      internal_svg: The runtime base SVG dimension is 200. Normal logical dimensions are converted with 
        logical/100*200, so 1 logical unit = 2 internal SVG units.
      aspectratio: Aspect ratio multiplies the reference dimensions. 2/1 yields a 400 x 200 internal SVG 
        viewBox, corresponding to a 200 x 100 logical canvas.
      examples:
        - description: Center an ungrouped item
          xpos: 50
          ypos: 50
        - description: Place an item one quarter from the left and halfway down
          xpos: 25
          ypos: 50
    group_coordinates:
      design_reason: Groups use 50,50 as their local no-offset position so a newly grouped item remains 
        visible at the group center. Authors can design grouped content around the middle instead of around 
        0,0 where part of it could fall outside the card.
      neutral_item_position:
        - 50
        - 50
      formula:
        x: final_x = group.xpos + item.xpos - 50
        y: final_y = group.ypos + item.ypos - 50
      nested_groups: The same 50-centered formula is applied recursively to parent groups.
      examples:
        - group:
            xpos: 30
            ypos: 40
          item:
            xpos: 50
            ypos: 50
          final:
            - 30
            - 40
        - group:
            xpos: 30
            ypos: 40
          item:
            xpos: 60
            ypos: 45
          final:
            - 40
            - 35
    typography:
      base_internal_font_size: 12
      base_svg_dimension: 200
      logical_em_equivalent: 6
      rule: For normal FHS text, 1em corresponds to approximately 6 logical units on the standard 100-unit 
        card; 2em is approximately 12 logical units.
      warning: CSS/em font sizes are not raw FHS width/height numbers. Do not interpret 1em as 1 logical unit.
    dimension_spaces:
      fhs-logical: Positions and most geometry use the 100-unit logical reference scale.
      raw-svg: A few legacy fields use internal SVG units directly; those fields are explicitly marked.
      css-style: CSS/SVG style properties such as font-size and stroke-width use their own style semantics.
      degrees: Rotation and angular path values are expressed in degrees.
    authoring_guidance:
      - Start ordinary 1/1 card placement from the 100 x 100 logical model.
      - When an item belongs to a group, design its local position around 50,50 rather than adding the item 
        coordinates directly to the group coordinates.
      - Use schema descriptions and x-fhs-unit annotations to distinguish logical geometry from CSS/em sizes 
        and legacy raw SVG values.
      - Prefer current fields over deprecated compatibility fields.
      - Treat JSON Schema structure as syntax, descriptions as field semantics, and x-fhs-relationships as the
        functional behavior graph between otherwise valid fields.
      - When modifying an existing valid FHS card, preserve its working structure and make the smallest change
        that satisfies the request instead of rebuilding it in another style.
      - Resolve inheritance and fallbacks before duplicating configuration. Entity-level color stops, actions,
        formatting and other shared configuration should be reused when the relationship graph says the item 
        can consume them.
      - When a reusable color-stop model also defines the value domain, prefer the explicit object form with 
        color_stops.scales.default plus colors; compact color-stop forms remain valid compatibility/authoring 
        syntax.
      - 'Distinguish FHS-defined behavior from authoring choices: positions, spacing and visual balance may be reasonable
        design decisions even when no schema relationship mandates a specific value.'
      - Treat the JavaScript template context as a documented runtime API. Do not invent context objects or 
        members.
      - 'entities and states are different: entities is the FHS card entity list and includes FHS-local inputs;
        states is Home Assistant hass.states.'
      - FHS visual tools render as SVG. Use SVG/CSS presentation semantics in styles; do not infer HTML layout
        semantics unless a specific FHS feature documents them.
    javascript_templates:
      state:
        meaning: Resolved state or selected attribute for the entity bound to the current item.
        source: current item entity_index/attribute
        shape: scalar resolved state/attribute value; convert with Number(...) when numeric arithmetic is 
          required
      entity:
        meaning: Complete resolved entity bound to the current item.
        source: current item entity_index
        shape: '{ entity_id, state, attributes, ... } entity-like object'
      entities:
        meaning: Resolved FHS card entity-state list in entities[] order.
        includes: Configured Home Assistant entities and configured FHS-local entities.
        usage: Use entities[index].state or entities[entity_slots.name[0]].state for card entities.
        shape: array of entity-like objects in root entities[] order
      entity_slots:
        meaning: Mapping from configured slot names to entity indexes.
        shape: object whose values are arrays of indexes
      states:
        meaning: Home Assistant state registry.
        source: hass.states
        important: This is not an alias for entities. Do not assume browser-local FHS entities exist in 
          states.
        shape: object/map keyed by Home Assistant entity_id; values are HA state objects
        reactivity: When a template reads a Home Assistant entity through states['domain.object_id'], also 
          include that entity in the card entities list so its state changes trigger card updates.
      hass:
        meaning: Home Assistant frontend hass object available to the card.
      constants:
        meaning: Resolved card constants available to the template.
        shape: object matching the resolved card constants namespace
      item:
        meaning: Current configured/normalized FHS item context.
        usage: Read current item configuration/context; do not mutate it as a persistence mechanism.
      user:
        meaning: Current Home Assistant user.
  examples:
    - type: custom:flex-horseshoe-card
      entities:
        - entity: sensor.example
      layout:
        texts:
          - id: center_label
            xpos: 50
            ypos: 50
            text: Example
  x-fhs-relationships:
    version: behavior-v12
    non_validating: true
    purpose: Non-validating runtime-parity metadata describing how public FHS fields select, activate, 
      inherit, override, reference and constrain one another. v12 adds explicit cross-layer contracts for 
      FHS-local entities, JavaScript context, slider metadata, and chart-family selectors.
    path_notation:
      root: Paths are public FHS YAML paths.
      arrays: '[] means any item in that public array.'
      wildcards: '* means any applicable normal layout section/item.'
      concepts: Targets beginning with @ name a semantic capability rather than a literal YAML field.
      resolved: Targets beginning with @resolved- name the effective value after documented public 
        inheritance/override/fallback rules are applied.
      alternatives: A|B in a path means the relation applies independently to either named public field.
      selectors: Square-bracket predicates such as layout.controls[type=slider] select items by configured 
        field value.
      constant_paths: constants.<path> uses JavaScript-like dot traversal. Dots separate nested object 
        properties and are not literal characters in top-level constant names.
    vocabulary:
      provides: The source makes a value or capability available for another feature to consume.
      requires: The source feature only has the described functional effect when the target 
        capability/configuration is available. This is behavioral, not necessarily a schema error.
      activates: The source value or state enables a behavior that otherwise remains inactive.
      overrides: When both source and target are available, the source takes precedence.
      fallback: The target is used when the source is absent or does not supply the needed value.
      references: The source identifies another configured object/value by index, slot, id, section/id pair, 
        or symbolic reference.
      affects: The source changes interpretation, geometry, rendering, or behavior of the target without being
        a hard requirement.
    relations:
      - id: entity-index-selects-entity
        type: references
        from: layout.*[].entity_index
        to: entities[]
        description: Selects the configured entity whose state/configuration is supplied to the layout item.
        resolution: Numeric indices address array position; named slot forms address the corresponding 
          configured slot where supported.
      - id: entity-slot-provides-symbolic-index
        type: provides
        from: entities[].slot
        to: '@entity-slot'
        description: Creates a symbolic entity selector that can be used instead of relying only on numeric 
          array positions.
      - id: entity-color-stops-provide-palette
        type: provides
        from: entities[].color_stops
        to: '@entity-color-palette'
        description: Defines a reusable color-stop palette on an entity configuration. The palette is passive 
          until a consuming visual mode activates color-stop behavior.
      - id: item-color-stops-provide-palette
        type: provides
        from: layout.*[].color_stops
        to: '@item-color-palette'
        description: Defines color stops directly on a layout item for color-stop-aware rendering. 
          SparklineGraphTool uses its separate nested sparkline.color_stops / sparkline.show interface.
      - id: item-color-stops-override-entity-palette
        type: overrides
        from: layout.*[].color_stops
        to: entities[layout.*[].entity_index].color_stops
        description: Item-level color_stops take precedence over color stops inherited from the selected 
          entity when both are present. SparklineGraphTool uses its separate nested sparkline.color_stops / 
          sparkline.show interface.
      - id: entity-color-stops-fallback
        type: fallback
        from: layout.*[].color_stops
        to: entities[layout.*[].entity_index].color_stops
        description: When a color-stop-aware item has no local color_stops, it can consume the selected entity
          configuration color stops instead. SparklineGraphTool uses its separate nested sparkline.color_stops
          / sparkline.show interface.
      - id: layout-item-style-activates-color-stops
        type: activates
        from: layout.*[].show.item_style
        to: '@resolved-item-color-palette'
        description: For ordinary color-stop-aware layout tools, color-stop rendering is activated by 
          item_style modes. SparklineGraphTool uses its separate nested sparkline.color_stops / sparkline.show
          interface.
        when:
          in:
            - colorstop
            - colorstopsegments
            - colorstopinterpolated
        resolution: Resolve local layout item color_stops first, otherwise the selected entity color_stops.
      - id: layout-item-style-requires-palette
        type: requires
        from: layout.*[].show.item_style
        to: '@resolved-item-color-palette'
        description: A color-stop item_style needs a resolved color-stop palette to produce color-dependent 
          visual output. SparklineGraphTool uses its separate nested sparkline.color_stops / sparkline.show 
          interface.
        when:
          in:
            - colorstop
            - colorstopsegments
            - colorstopinterpolated
        effect_if_missing: Color-stop styling has no palette to consume; this relationship is not promoted to 
          a JSON Schema validation error.
      - id: local-color-stops-default-item-mode
        type: activates
        from: layout.*[].color_stops
        to: layout.*[].show.item_style
        description: For ordinary layout items that support the generic color-stop model, local color_stops 
          can activate the default hard color-stop mode when item_style is omitted. SparklineGraphTool uses 
          its separate nested sparkline.color_stops / sparkline.show interface.
        when:
          missing: show.item_style
        result: colorstop
      - id: item-style-selects-paint-dictionary
        type: references
        from: layout.*[].show.item_style
        to: layout.*[].{selected-mode}
        description: The selected generic item_style chooses the same-named mode dictionary that controls 
          whether the calculated color is applied to fill, stroke, or both. SparklineGraphTool uses its 
          separate nested sparkline.color_stops / sparkline.show interface.
        mapping:
          colorstop: colorstop
          colorstopsegments: colorstopsegments
          colorstopinterpolated: colorstopinterpolated
      - id: horseshoe-style-activates-color-stops
        type: activates
        from: layout.horseshoes[].show.horseshoe_style
        to: '@resolved-horseshoe-color-palette'
        description: Color-dependent horseshoe_style modes activate the resolved horseshoe color-stop palette.
          Resolve local horseshoe color_stops first, otherwise the selected entity color_stops.
        when:
          in:
            - colorstop
            - colorstopinterpolated
            - colorstopsegments
            - colorstopgradient
            - lineargradient
      - id: horseshoe-style-requires-color-stops
        type: requires
        from: layout.horseshoes[].show.horseshoe_style
        to: '@resolved-horseshoe-color-palette'
        description: Color-dependent horseshoe_style modes need the resolved horseshoe color-stop palette to 
          produce their intended color-dependent output.
        when:
          in:
            - colorstop
            - colorstopinterpolated
            - colorstopsegments
            - colorstopgradient
            - lineargradient
        effect_if_missing: The selected color-stop style lacks its color source; this is behavior metadata 
          rather than a schema constraint.
      - id: horseshoe-scale-style-activates-color-stops
        type: activates
        from: layout.horseshoes[].show.scale_style
        to: '@resolved-horseshoe-color-palette'
        description: Color-dependent scale_style modes consume the same resolved horseshoe color-stop palette 
          as the state layer.
        when:
          in:
            - colorstop
            - colorstopinterpolated
            - colorstopsegments
            - colorstopgradient
            - lineargradient
      - id: horseshoe-min-overrides-color-stop-scale
        type: overrides
        from: layout.horseshoes[].horseshoe_scale.min
        to: '@resolved-horseshoe-color-scale.min'
        description: An explicit horseshoe_scale.min overrides the minimum supplied by the resolved color-stop
          scales.default for horseshoe geometry.
      - id: horseshoe-max-overrides-color-stop-scale
        type: overrides
        from: layout.horseshoes[].horseshoe_scale.max
        to: '@resolved-horseshoe-color-scale.max'
        description: An explicit horseshoe_scale.max overrides the maximum supplied by the resolved color-stop
          scales.default for horseshoe geometry.
      - id: horseshoe-min-fallback
        type: fallback
        from: layout.horseshoes[].horseshoe_scale.min
        to: '@resolved-horseshoe-color-scale.min'
        description: If horseshoe_scale.min is omitted, the resolved color-stop scales.default minimum is used
          when available; otherwise runtime falls back to 0.
        final_fallback: 0
      - id: horseshoe-max-fallback
        type: fallback
        from: layout.horseshoes[].horseshoe_scale.max
        to: '@resolved-horseshoe-color-scale.max'
        description: If horseshoe_scale.max is omitted, the resolved color-stop scales.default maximum is used
          when available; otherwise runtime falls back to 100.
        final_fallback: 100
      - id: horseshoe-state-map-affects-value
        type: affects
        from: layout.horseshoes[].state_map
        to: '@horseshoe-render-value'
        description: Maps non-numeric/string entity states into values or levels used by horseshoe state 
          rendering and color selection where configured.
      - id: state-map-affects-color-stop-value
        type: affects
        from: layout.states[].state_map
        to: '@item-color-stop-input'
        description: A state_value mapping can convert textual entity states into numeric values before 
          color-stop selection.
      - id: same-as-references-earlier-item
        type: references
        from: layout.*[].same_as
        to: layout.{same-section}[].id
        description: same_as inherits an earlier item in the same layout section by id.
      - id: same-as-local-fields-override
        type: overrides
        from: layout.*[] local fields
        to: layout.*[].same_as inherited fields
        description: Fields supplied on the same_as item override inherited values; nested object overrides 
          may be partial because configuration merging is deep.
      - id: same-as-replace-affects-merge
        type: affects
        from: layout.*[].same_as_replace
        to: '@same-as-merge'
        description: Marks inherited paths that must be replaced instead of deep-merged during same_as 
          compilation.
      - id: same-as-delta-affects-inherited-value
        type: affects
        from: layout.*[].same_as_d<field>
        to: layout.*[].<field>
        description: Adds a static numeric delta to the inherited value of the corresponding known numeric 
          field after same_as inheritance.
      - id: fit-references-item-geometry
        type: references
        from: layout.rectangles[].fit
        to: layout.{fit.section}[id=fit.item_id]
        description: Uses the measured geometry of another layout item to size/fit a rectangle; padding 
          expands that measured geometry.
      - id: dimension-reference-references-item
        type: references
        from: layout.rectangles[].width|height
        to: layout.{section}[id=item_id]
        description: Object-form width/height item references reuse measured dimensions from another layout 
          item.
      - id: group-references-group
        type: references
        from: layout.*[].group
        to: layout.groups[].id
        description: Assigns a layout item to the named group and therefore to that group local coordinate 
          frame.
      - id: group-affects-position
        type: affects
        from: layout.*[].group
        to: layout.*[].xpos|ypos
        description: Grouped items use the group-local 50,50 neutral position. Final position is group 
          position plus item position minus 50 on each axis.
      - id: nested-group-affects-position
        type: affects
        from: layout.groups[].parent
        to: layout.groups[].xpos|ypos
        description: Nested groups recursively use the same 50-centered local-coordinate rule after resolving 
          their parent group.
      - id: clip-references-definition
        type: references
        from: layout.*[].clip
        to: layout.clips.<name>
        description: Applies the named clip definition to the rendered layout item.
      - id: mask-references-definition
        type: references
        from: layout.*[].mask|layout.*[].mask[]
        to: layout.masks.<name>
        description: A mask string references one named mask. A mask array references multiple masks that are 
          applied as nested masks in configured order.
      - id: mask-soft-arc-references-clip
        type: references
        from: layout.masks.<name>.soft_arc.clip
        to: layout.clips.<name>
        description: soft_arc derives its fade geometry from the first arc in the referenced clip definition.
        resolution: The referenced clip must exist and supply arcs[0]; the runtime expands soft_arc into 
          separate edge and chord masks.
      - id: animation-id-references-animation
        type: references
        from: layout.*[].animation_id
        to: animations.<id>
        description: Selects the animation/style entry used for that layout item.
      - id: item-color-filter-overrides-context
        type: affects
        from: layout.*[].color_filter
        to: '@render-color-filter-cascade'
        description: Item color_filter participates after card and group filters in the render cascade.
        order:
          - card.color_filter
          - ancestor groups[].color_filter
          - item.color_filter
          - tool/layer-specific color_filter
      - id: group-color-filter-affects-descendants
        type: affects
        from: layout.groups[].color_filter
        to: '@descendant-render-color-filter-cascade'
        description: A group color_filter participates in the color-filter cascade for items in that group, 
          including ancestor group chains.
      - id: ref-references-constant
        type: references
        from: ref(path)
        to: constants.<path>
        description: ref(path) resolves a whole-value static reference through card constants. Dot notation 
          traverses nested object properties using JavaScript-style identifier segments; arrays are not 
          traversed by index.
        resolution: The resolved scalar is inserted directly. Resolved objects and arrays are deep-cloned so 
          each ref() insertion is independent.
      - id: calc-references-constants
        type: references
        from: calc(expression)
        to: constants.<numeric-path>
        description: calc() may use numeric top-level constants and nested numeric object paths that are 
          already available in declaration order. Non-numeric leaves and arrays are not exposed to the calc 
          scope.
        resolution: calc() evaluates once at the configuration boundary and must return a finite number. Later
          constants may use earlier numeric constants/namespaces.
      - id: template-references-template
        type: references
        from: template
        to: '@fhs-template'
        description: Root, entity and tool template fields select an FHS template and optionally supply 
          variables before normal runtime use.
      - id: entity-attribute-selects-state-source
        type: affects
        from: entities[].attribute
        to: '@resolved-entity-value'
        description: When attribute is configured, entity-bound display tools use that Home Assistant 
          attribute value instead of the entity state.
      - id: entity-name-provides-display-name
        type: provides
        from: entities[].name
        to: '@resolved-entity-name'
        description: Provides the configured display name consumed by entity-name aware tools instead of 
          relying only on the Home Assistant friendly name.
      - id: entity-icon-provides-display-icon
        type: provides
        from: entities[].icon
        to: '@resolved-entity-icon'
        description: Provides an explicit icon source for entity-icon aware tools; otherwise they may derive 
          the icon from Home Assistant entity metadata.
      - id: entity-unit-overrides-ha-unit
        type: overrides
        from: entities[].unit
        to: '@home-assistant-unit-of-measurement'
        description: An explicit entity unit replaces the unit returned by Home Assistant formatting for FHS 
          state/UOM display.
      - id: entity-decimals-provides-default-precision
        type: provides
        from: entities[].decimals
        to: '@state-number-precision'
        description: Provides the default minimum and maximum fractional precision for numeric StateTool 
          formatting unless a state format override supplies a more specific bound.
      - id: entity-format-provides-default-state-format
        type: provides
        from: entities[].format
        to: '@resolved-state-format'
        description: Provides default state formatting options for state-derived text when the layout state 
          item does not supply its own format object.
      - id: state-format-overrides-entity-format
        type: overrides
        from: layout.states[].format
        to: entities[layout.states[].entity_index].format
        description: An item-level state format object takes precedence over the selected entity format object
          for that state item.
      - id: state-format-decimals-min-overrides-default
        type: overrides
        from: layout.states[].format.decimals_min
        to: '@state-number-precision.minimum'
        description: decimals_min overrides the minimum fractional digits otherwise supplied by 
          entities[].decimals or Home Assistant precision.
      - id: state-format-decimals-max-overrides-default
        type: overrides
        from: layout.states[].format.decimals_max
        to: '@state-number-precision.maximum'
        description: decimals_max overrides the maximum fractional digits otherwise supplied by 
          entities[].decimals or Home Assistant precision.
      - id: state-uom-show-activates-uom
        type: activates
        from: layout.states[].show.uom
        to: '@state-uom-rendering'
        description: The end, top and bottom modes render the resolved unit of measurement with the state; 
          none suppresses it. top/bottom create a vertical state+UOM layout.
        when:
          in:
            - end
            - top
            - bottom
      - id: state-uom-config-affects-uom
        type: affects
        from: layout.states[].uom
        to: '@state-uom-rendering'
        description: The uom block styles and offsets the UOM that is made visible by show.uom; it does not by
          itself select whether the UOM is shown.
      - id: state-map-affects-display-value
        type: affects
        from: layout.states[].state_map
        to: '@state-display-value'
        description: State mappings can translate textual/entity states into display values or labels used by 
          StateTool in addition to their color-stop input role.
      - id: item-action-overrides-entity-action
        type: overrides
        from: layout.*[].tap_action|hold_action|double_tap_action
        to: entities[layout.*[].entity_index].tap_action|hold_action|double_tap_action
        description: A gesture action configured on a layout item takes precedence over the same gesture 
          action on the selected entity configuration.
      - id: entity-action-fallback
        type: fallback
        from: layout.*[].tap_action|hold_action|double_tap_action
        to: entities[layout.*[].entity_index].tap_action|hold_action|double_tap_action
        description: When an entity-bound layout item omits a gesture action, FHS uses the corresponding 
          action from the selected entity when configured.
      - id: tap-action-default-more-info
        type: fallback
        from: entities[].tap_action
        to: '@default-tap-action-more-info'
        description: For an entity-bound item with neither item-level nor entity-level tap_action, the normal 
          tap fallback is Home Assistant more-info when a valid Home Assistant target exists.
      - id: action-entity-overrides-bound-target
        type: overrides
        from: '*.{tap_action|hold_action|double_tap_action}.entity'
        to: '@gesture-bound-entity-target'
        description: An entity explicitly supplied inside an action overrides the entity target inferred from 
          the item entity_index for that action.
      - id: entity-color-scale-provides-shared-domain
        type: provides
        from: entities[].color_stops.scales.default
        to: '@entity-color-scale'
        description: The default scale travels with an entity color-stop model and provides its reusable value
          domain to consumers that use the entity palette.
      - id: item-color-scale-provides-local-domain
        type: provides
        from: layout.*[].color_stops.scales.default
        to: '@item-color-scale'
        description: An item-local color-stop default scale provides the value domain that travels with the 
          item-local palette.
      - id: horseshoe-local-color-stops-override-entity
        type: overrides
        from: layout.horseshoes[].color_stops
        to: entities[layout.horseshoes[].entity_index].color_stops
        description: A horseshoe-local color_stops model takes precedence over the color-stop model supplied 
          by its selected entity.
      - id: horseshoe-entity-color-stops-fallback
        type: fallback
        from: layout.horseshoes[].color_stops
        to: entities[layout.horseshoes[].entity_index].color_stops
        description: When a horseshoe does not define local color_stops, its resolved color-stop model can 
          come from the selected entity configuration.
      - id: horseshoe-resolved-color-scale-provides-range
        type: provides
        from: '@resolved-horseshoe-color-palette.scales.default'
        to: '@resolved-horseshoe-color-scale'
        description: The scales.default embedded in the resolved horseshoe color-stop model supplies the 
          default min/max range before explicit horseshoe_scale min/max overrides are applied.
      - id: horseshoe-background-show-activates-background
        type: activates
        from: layout.horseshoes[].show.horseshoe_background
        to: layout.horseshoes[].horseshoe_background
        description: A horseshoe_background block is rendered only when show.horseshoe_background selects a 
          background mode instead of none.
        when:
          in:
            - fixed
            - colorstop
            - colorstopsegments
            - colorstopgradient
            - lineargradient
      - id: horseshoe-background-color-mode-activates-color-stops
        type: activates
        from: layout.horseshoes[].show.horseshoe_background
        to: '@resolved-horseshoe-color-palette'
        description: Color-stop/gradient horseshoe background modes consume the resolved horseshoe color-stop 
          palette.
        when:
          in:
            - colorstop
            - colorstopsegments
            - colorstopgradient
            - lineargradient
      - id: horseshoe-background-width-fallback
        type: fallback
        from: layout.horseshoes[].horseshoe_background.width
        to: layout.horseshoes[].horseshoe_scale.width
        description: When horseshoe_background.width is omitted, the background uses horseshoe_scale.width.
      - id: horseshoe-state-progress-activates-state-path
        type: activates
        from: layout.horseshoes[].show.state_progress
        to: '@horseshoe-state-progress-path'
        description: state_progress controls whether the filled/current-value state path is rendered.
        when:
          equals: true
      - id: horseshoe-state-marker-activates-marker
        type: activates
        from: layout.horseshoes[].show.state_marker
        to: layout.horseshoes[].horseshoe_marker
        description: state_marker controls whether the marker at the current value is rendered; a useful 
          default path marker exists even without an explicit horseshoe_marker block.
        when:
          equals: true
      - id: horseshoe-marker-size-fallback
        type: fallback
        from: layout.horseshoes[].horseshoe_marker.size
        to: layout.horseshoes[].horseshoe_state.width
        description: For a path-attached marker, size defaults to horseshoe_state.width when no explicit 
          marker size is supplied.
      - id: horseshoe-marker-style-fallback
        type: fallback
        from: layout.horseshoes[].horseshoe_marker.styles
        to: '@current-horseshoe-state-appearance'
        description: Without explicit marker styles, the marker follows the current horseshoe state 
          appearance, including state color behavior.
      - id: horseshoe-labels-show-activates-labels
        type: activates
        from: layout.horseshoes[].show.labels_at
        to: layout.horseshoes[].horseshoe_labels
        description: labels_at selects where configured horseshoe labels are rendered; none leaves the label 
          layer inactive.
      - id: horseshoe-string-state-mode-requires-state-map
        type: requires
        from: layout.horseshoes[].horseshoe_state.mode
        to: '@resolved-horseshoe-state-map'
        description: stringstate_mode and stringstate_level need a state map that translates source states 
          into their segment/level semantics.
        when:
          in:
            - stringstate_mode
            - stringstate_level
      - id: horseshoe-item-state-map-overrides-state-map
        type: overrides
        from: layout.horseshoes[].state_map
        to: layout.horseshoes[].horseshoe_state.state_map
        description: A state_map on the horseshoe item takes precedence over a state_map nested inside 
          horseshoe_state.
      - id: horseshoe-state-map-fallback
        type: fallback
        from: layout.horseshoes[].state_map
        to: layout.horseshoes[].horseshoe_state.state_map
        description: If the horseshoe item has no state_map, FHS can use horseshoe_state.state_map instead.
      - id: horseshoe-spline-type-requires-spline
        type: requires
        from: layout.horseshoes[].horseshoe_scale.type
        to: layout.horseshoes[].horseshoe_scale.spline
        description: Spline scale types require the corresponding spline definition to map values along the 
          path.
        when:
          in:
            - spline
            - splineorg
      - id: horseshoe-bar-mode-affects-zero-geometry
        type: affects
        from: layout.horseshoes[].bar_mode
        to: '@horseshoe-zero-and-progress-geometry'
        description: bar_mode changes how progress grows around zero/the path, including normal, bidirectional
          and absolute behaviors.
      - id: horseshoe-zero-ratio-fallback
        type: fallback
        from: layout.horseshoes[].zero_ratio
        to: '@zero-ratio-derived-from-resolved-scale'
        description: When zero_ratio is omitted, FHS derives the zero position from the resolved horseshoe 
          scale; symmetrical bidirectional modes use the midpoint.
      - id: group-parent-references-group
        type: references
        from: layout.groups[].parent
        to: layout.groups[].id
        description: A group parent names another configured group; omitted parent means the implicit card 
          root.
      - id: group-visibility-affects-descendants
        type: affects
        from: layout.groups[].visibility
        to: '@descendant-item-visibility'
        description: Group visibility cascades through the parent chain. A hidden ancestor keeps every 
          descendant hidden even when the child itself is visible.
      - id: item-visibility-affects-rendering
        type: affects
        from: layout.*[].visibility
        to: '@item-visible-rendering'
        description: visibility:hidden suppresses visible/pointer rendering but keeps the tool in normal 
          lifecycle/measurement behavior.
      - id: group-scale-affects-descendants
        type: affects
        from: layout.groups[].scale
        to: '@descendant-render-transform'
        description: A group scale contributes to the render transform of items assigned to that group.
      - id: item-flip-affects-transform
        type: affects
        from: layout.*[].flip
        to: '@item-render-transform'
        description: flip mirrors the rendered item on x, y or both axes and combines with its resolved group 
          scale.
      - id: dzpos-affects-resolved-layer
        type: affects
        from: layout.*[].dzpos
        to: layout.*[].zpos
        description: dzpos is added to the resolved/default zpos to determine the final layer position.
      - id: control-type-selects-control-contract
        type: activates
        from: layout.controls[].type
        to: '@matching-control-behavior'
        description: The top-level type discriminator selects the toggle, select, number, button or slider 
          control behavior and its matching public configuration.
      - id: toggle-item-style-selects-style-config
        type: references
        from: layout.controls[type=toggle].show.item_style
        to: layout.controls[type=toggle].{selected-item-style}
        description: A toggle item_style selects the same-named visual configuration, such as ha, ios or 
          industrial.
      - id: select-item-viz-selects-viz-config
        type: references
        from: layout.controls[type=select].show.item_viz
        to: layout.controls[type=select].{selected-item-viz}
        description: Select item_viz chooses the visualization block, currently viz_button or viz_line.
      - id: select-option-map-fallback-to-entity-options
        type: fallback
        from: layout.controls[type=select].option_map
        to: '@selected-entity-options'
        description: When option_map is omitted, the select control derives its selectable options from the 
          bound entity options.
      - id: select-option-actions-fallback-to-control-actions
        type: fallback
        from: layout.controls[type=select].option_map[].tap_action|hold_action|double_tap_action
        to: layout.controls[type=select].tap_action|hold_action|double_tap_action
        description: Each explicit select option inherits the corresponding control gesture action when that 
          option does not override it.
      - id: select-option-reference-resolves-option-value
        type: references
        from: option(path)
        to: layout.controls[type=select].option_map[].<path>
        description: Inside select-option action configuration, an exact option(path) reference is replaced 
          with that option field while preserving its datatype.
      - id: slider-item-viz-selects-viz-config
        type: references
        from: layout.controls[type=slider].show.item_viz
        to: layout.controls[type=slider].{selected-item-viz}
        description: Slider item_viz selects the matching visualization block, currently linear or circular.
      - id: slider-range-variant-requires-two-values
        type: requires
        from: layout.controls[type=slider].show.item_variant
        to: layout.controls[type=slider].values
        description: A range slider binds exactly two value channels through values[].
        when:
          equals: range
      - id: slider-values-reference-entities
        type: references
        from: layout.controls[type=slider].values[].entity_index
        to: entities[]
        description: Each slider value channel can bind its own entity; range sliders use the two bound 
          entities as lower and upper values.
      - id: slider-scale-attribute-references-entity-attribute
        type: references
        from: layout.controls[type=slider].scale.min|scale.max|scale.step.attribute
        to: entities[layout.controls[type=slider].values[0].entity_index].attributes
        description: 'Object-form slider scale entries such as {attribute: min} read min/max/step metadata from
          the first slider value entity.'
      - id: slider-value-display-reuses-state-formatting
        type: affects
        from: layout.controls[type=slider].value.state
        to: '@slider-value-state-rendering'
        description: Visible slider values are rendered through normal StateTool semantics, so nested 
          value.state can control state/UOM formatting and styles.
      - id: sparkline-series-entity-index-references-entity
        type: references
        from: layout.sparklines[].series[].entity_index
        to: entities[]
        description: Each sparkline series may select its own configured entity independently from the 
          coordinator sparkline item.
      - id: multipart-text-entity-index-references-entity
        type: references
        from: layout.texts[].text.parts[].entity_index
        to: entities[]
        description: Entity-derived multipart text parts can select the entity whose name/area/state/unit 
          semantics they render.
      - id: constant-name-provides-addressable-root
        type: provides
        from: constants.<name>
        to: '@constant-root'
        description: Each top-level constant name creates one addressable root for ref() and calc().
        when:
          name_pattern: ^[A-Za-z_][A-Za-z0-9_]*$
      - id: constant-declaration-order-affects-calc-scope
        type: affects
        from: constants insertion order
        to: calc(expression)
        description: Constants are compiled in declaration order; a later constant can calculate from earlier 
          numeric constants or nested numeric namespaces, not from a later declaration.
      - id: ref-object-array-deep-clones-fragment
        type: affects
        from: ref(path)
        to: '@resolved-static-value'
        description: When the referenced value is an object or array, FHS deep-clones it before insertion so 
          separate ref() uses can be modified independently.
      - id: calc-math-builtins-provide-functions
        type: provides
        from: '@static-math-builtins'
        to: calc(expression)
        description: Static calc exposes sin, cos, tan, abs, round, floor, ceil, min, max, sqrt and PI in 
          addition to numeric constants.
        resolution: calc expressions must resolve to a finite number.
      - id: ref-and-calc-are-whole-value-expressions
        type: requires
        from: ref(path)|calc(expression)
        to: '@whole-config-value'
        description: Static ref()/calc() syntax replaces the whole configured value; FHS does not perform 
          substring interpolation inside arbitrary strings.
      - id: style-gradient-references-gradient-definition
        type: references
        from: layout.*[].styles.<paint>=gradient(name)
        to: layout.gradients.<name>
        description: A style paint value gradient(name) references a card-scoped layout gradient. Use 
          gradient(name), not a raw url(#name), because runtime SVG ids are card-scoped.
      - id: gradient-units-affect-numeric-coordinate-meaning
        type: affects
        from: layout.gradients.<name>.gradientUnits
        to: layout.gradients.<name>.x1|y1|x2|y2|cx|cy|r
        description: 'gradientUnits controls numeric coordinate interpretation: objectBoundingBox numbers are percentages
          0..100; userSpaceOnUse numbers are FHS logical dimensions converted to SVG units.'
      - id: gradient-numeric-stop-offset-is-percentage
        type: affects
        from: layout.gradients.<name>.stops[].offset
        to: '@svg-gradient-stop-offset'
        description: 'Numeric gradient stop offsets are FHS percentages: 0 is 0%, 50 is 50%, 100 is 100%.'
      - id: mask-array-composes-by-nesting
        type: affects
        from: layout.*[].mask[]
        to: '@rendered-item-mask-stack'
        description: Multiple configured masks are nested in array order; every mask constrains the result of 
          the previous mask rather than being painted into one combined mask.
      - id: item-mask-applies-before-clip
        type: affects
        from: layout.*[].mask|layout.*[].clip
        to: '@rendered-item-layer-stack'
        description: FHS first nests configured masks and then wraps the masked result in the configured clip 
          path.
      - id: soft-arc-requires-clip-arc
        type: requires
        from: layout.masks.<name>.soft_arc.clip
        to: layout.clips.<clip>.arcs[0]
        description: A soft_arc mask needs the first arc geometry of its referenced clip to derive edge and 
          chord fades.
      - id: relative-definition-offset-affects-item-specific-definition
        type: affects
        from: layout.clips.<name>.*[].dxpos|dypos|layout.masks.<name>.*[].dxpos|dypos
        to: '@item-specific-definition'
        description: A clip/mask shape using dxpos or dypos is resolved relative to each consuming item, so 
          FHS renders an item-specific SVG definition id.
      - id: action-list-executes-sequentially
        type: affects
        from: '*.tap_action.actions[]|*.hold_action.actions[]|*.double_tap_action.actions[]'
        to: '@gesture-execution-order'
        description: When actions[] is supplied, configured actions execute sequentially in array order.
      - id: perform-action-requires-perform-action-id
        type: requires
        from: '*.action'
        to: '*.perform_action'
        description: A perform-action action uses perform_action as the domain.service identifier.
        when:
          equals: perform-action
      - id: call-service-requires-service-id
        type: requires
        from: '*.action'
        to: '*.service'
        description: A call-service action uses service as the domain.service identifier.
        when:
          equals: call-service
      - id: navigate-action-requires-path
        type: requires
        from: '*.action'
        to: '*.navigation_path'
        description: A navigate action consumes navigation_path; navigation_replace chooses replaceState 
          instead of pushState.
        when:
          equals: navigate
      - id: url-action-requires-url-path
        type: requires
        from: '*.action'
        to: '*.url_path'
        description: A url action opens url_path in a new browser target.
        when:
          equals: url
      - id: select-option-action-requires-option
        type: requires
        from: '*.action'
        to: '*.option'
        description: A select-option action submits option to the bound select/input_select/number-compatible 
          target.
        when:
          equals: select-option
      - id: source-entity-index-routes-action-target
        type: overrides
        from: entities[].source_entity_index
        to: '@bound-action-entity'
        description: When a bound entity configuration has source_entity_index, item/entity actions target 
          that source entity unless the action explicitly supplies entity.
      - id: number-control-decrement-shorthand-translates-action
        type: affects
        from: layout.controls[type=number].content.*.minus.tap_action.action
        to: perform-action(<bound-domain>.decrement)
        description: The local decrement shorthand is accepted by number-control minus buttons and translated 
          at setState to a perform-action on the bound entity domain.
        when:
          equals: decrement
      - id: number-control-increment-shorthand-translates-action
        type: affects
        from: layout.controls[type=number].content.*.plus.tap_action.action
        to: perform-action(<bound-domain>.increment)
        description: The local increment shorthand is accepted by number-control plus buttons and translated 
          at setState to a perform-action on the bound entity domain.
        when:
          equals: increment
      - id: slider-set-value-shorthand-translates-action
        type: affects
        from: layout.controls[type=slider].set_value_action.action
        to: perform-action(<bound-domain>.set_value)
        description: Slider-local set-value is translated to perform-action on the active bound entity with 
          data.value set to the current slider value.
        when:
          equals: set-value
      - id: slider-value-field-injects-current-value
        type: affects
        from: layout.controls[type=slider].set_value_action.value_field
        to: '@executed-slider-action'
        description: For a custom slider action, value_field is a dotted destination path that receives the 
          current active slider value before execution.
      - id: slider-value-fields-inject-range-values
        type: affects
        from: layout.controls[type=slider].set_value_action.value_fields
        to: '@executed-slider-action'
        description: For a range slider, value_fields maps destination paths to lower or upper so both current
          values can be inserted into a custom action.
      - id: sparkline-block-provides-graph-configuration
        type: provides
        from: layout.sparklines[].sparkline
        to: '@sparkline-graph-config'
        description: Graph selectors and chart-family configuration live inside the nested sparkline block. 
          period, x_axis, y_axis and series remain at the sparkline item root.
      - id: sparkline-chart-type-selects-chart-family
        type: activates
        from: layout.sparklines[].sparkline.show.chart_type
        to: layout.sparklines[].sparkline.<chart_type>
        description: chart_type is the primary graph-family discriminator and activates the matching nested 
          graph-family configuration.
      - id: sparkline-radial-chart-variant-selects-render-family
        type: activates
        from: layout.sparklines[].sparkline.show.chart_variant
        to: layout.sparklines[].sparkline.line|area|dots
        description: For chart_type radial, chart_variant must be line, area or dots and selects that 
          presentation family.
        when:
          chart_type: radial
          in:
            - line
            - area
            - dots
      - id: sparkline-radial-barcode-chart-viz-selects-segment-shape
        type: affects
        from: layout.sparklines[].sparkline.show.chart_viz
        to: layout.sparklines[].sparkline.radial_barcode
        description: For radial_barcode, chart_viz selects the rendered interval/segment shape and works 
          together with chart_variant.
      - id: sparkline-period-type-selects-period-branch
        type: activates
        from: layout.sparklines[].period.type
        to: layout.sparklines[].period.<type>
        description: period.type selects calendar, rolling_window or real_time behavior. Historical types 
          consume their matching nested branch; real_time has no history duration.
      - id: sparkline-history-duration-hour-provides-window
        type: provides
        from: 
          layout.sparklines[].period.calendar.duration.hour|layout.sparklines[].period.rolling_window.duration.hour
        to: '@sparkline-history-duration-hours'
        description: Current history and graph runtime reads duration.hour directly. Express multi-day windows
          in hours.
      - id: sparkline-bins-affect-history-resolution
        type: affects
        from: layout.sparklines[].period.*.bins
        to: '@sparkline-bin-plan'
        description: Historical bins determine the shared time-bucket resolution used by graph geometry, ticks
          and pointer buckets.
      - id: sparkline-auto-bins-depend-on-chart-width-duration-density
        type: affects
        from: layout.sparklines[].period.*.bins.per_hour
        to: '@sparkline-bin-plan'
        description: When per_hour is auto, FHS derives a concrete density from available graph width/radial 
          arc length, chart family, history duration and bins.density.
        when:
          equals: auto
      - id: sparkline-show-grid-x-activates-x-grid
        type: activates
        from: layout.sparklines[].sparkline.show.grid.x
        to: layout.sparklines[].x_axis.grid_major|grid_minor
        description: Enables X grid rendering when the selected chart family exposes an X axis.
        when:
          equals: true
      - id: sparkline-show-grid-y-activates-y-grid
        type: activates
        from: layout.sparklines[].sparkline.show.grid.y
        to: layout.sparklines[].y_axis.grid_major|grid_minor
        description: Enables Y grid rendering when the selected chart family exposes a Y axis.
        when:
          equals: true
      - id: sparkline-show-axis-x-activates-x-axis
        type: activates
        from: layout.sparklines[].sparkline.show.axis.x
        to: layout.sparklines[].x_axis.axis
        description: Shows the X-axis path when the selected chart family exposes an X axis.
        when:
          equals: true
      - id: sparkline-show-axis-y-activates-y-axis
        type: activates
        from: layout.sparklines[].sparkline.show.axis.y
        to: layout.sparklines[].y_axis.axis
        description: Shows the Y-axis path when the active series chart family exposes a Y axis.
        when:
          equals: true
      - id: sparkline-show-tickmarks-x-activates-x-tickmarks
        type: activates
        from: layout.sparklines[].sparkline.show.tickmarks.x
        to: layout.sparklines[].x_axis.tickmarks_major|tickmarks_minor
        description: Shows X tick marks when the selected chart family exposes an X axis. This toggle is 
          independent of show.axis.x.
        when:
          equals: true
      - id: sparkline-show-tickmarks-y-activates-y-tickmarks
        type: activates
        from: layout.sparklines[].sparkline.show.tickmarks.y
        to: layout.sparklines[].y_axis.tickmarks_major|tickmarks_minor
        description: Shows Y tick marks when the active series chart family exposes a Y axis. This toggle is 
          independent of show.axis.y.
        when:
          equals: true
      - id: sparkline-show-labels-x-activates-x-labels
        type: activates
        from: layout.sparklines[].sparkline.show.labels.x
        to: layout.sparklines[].x_axis.labels
        description: Shows calculated X/time labels when the selected chart family exposes an X axis. This 
          toggle is independent of show.axis.x.
        when:
          equals: true
      - id: sparkline-show-labels-y-activates-y-labels
        type: activates
        from: layout.sparklines[].sparkline.show.labels.y
        to: layout.sparklines[].y_axis.labels
        description: Shows calculated Y/value/state labels when the active series chart family exposes a Y 
          axis. This toggle is independent of show.axis.y.
        when:
          equals: true
      - id: sparkline-chart-type-limits-axis-capabilities
        type: affects
        from: layout.sparklines[].sparkline.show.chart_type
        to: '@sparkline-axis-capabilities'
        description: 'Chart family limits which axis layers can render: line/area/bar/dots/equalizer/state_bands/radial
          support X+Y; barcode/radial_barcode support X only; graded supports neither.'
      - id: sparkline-x-axis-config-affects-x-presentation
        type: affects
        from: layout.sparklines[].x_axis
        to: '@sparkline-x-axis-presentation'
        description: x_axis config supplies axis, grid, tick and label styling/spacing for enabled X layers; 
          configuring it does not itself show those layers.
      - id: sparkline-y-axis-config-affects-y-presentation
        type: affects
        from: layout.sparklines[].y_axis
        to: '@sparkline-y-axis-presentation'
        description: y_axis config supplies bounds, axis, grid, tick and label styling/spacing for enabled Y 
          layers; configuring it does not itself show those layers.
      - id: sparkline-show-legend-activates-legend
        type: activates
        from: layout.sparklines[].sparkline.show.legend
        to: layout.sparklines[].sparkline.legend
        description: show.legend activates legend measurement/rendering and reserves graph area.
        when:
          equals: true
      - id: sparkline-legend-position-affects-graph-area
        type: affects
        from: layout.sparklines[].sparkline.legend.position
        to: '@sparkline-graph-area'
        description: Legend position controls orientation and which side of the sparkline viewport is reserved
          for the legend.
      - id: sparkline-show-day-night-activates-day-night
        type: activates
        from: layout.sparklines[].sparkline.show.day_night
        to: layout.sparklines[].sparkline.day_night
        description: show.day_night activates auxiliary sun/day-night history and the configured 
          background/band visualization.
        when:
          equals: true
      - id: sparkline-day-night-requires-historical-period
        type: requires
        from: layout.sparklines[].sparkline.show.day_night
        to: layout.sparklines[].period.type
        description: Day/night rendering requires calendar or rolling_window history and is rejected for 
          real_time.
        when:
          equals: true
          period_type_not: real_time
      - id: sparkline-day-night-rejects-future-calendar-offset
        type: requires
        from: layout.sparklines[].sparkline.show.day_night
        to: layout.sparklines[].period.calendar.offset
        description: With a calendar period, day/night rendering does not support a positive future offset.
        when:
          equals: true
          period_type: calendar
          maximum: 0
      - id: sparkline-show-line-activates-line-layer
        type: activates
        from: layout.sparklines[].sparkline.show.line
        to: layout.sparklines[].sparkline.line
        description: For line/area and radial line/area presentations, show.line controls whether the line 
          path is retained/rendered.
        when:
          not_equals: false
      - id: sparkline-show-points-activates-dot-layer
        type: activates
        from: layout.sparklines[].sparkline.show.points
        to: layout.sparklines[].sparkline.dots
        description: show.points adds point geometry for compatible line/area/radial presentations.
        when:
          equals: true
      - id: sparkline-line-show-dots-activates-dot-layer
        type: activates
        from: layout.sparklines[].sparkline.line.show_dots
        to: layout.sparklines[].sparkline.dots
        description: line.show_dots adds dots even when the chart family itself is line.
        when:
          equals: true
      - id: sparkline-area-show-dots-activates-dot-layer
        type: activates
        from: layout.sparklines[].sparkline.area.show_dots
        to: layout.sparklines[].sparkline.dots
        description: area.show_dots adds dots to an area presentation.
        when:
          equals: true
      - id: sparkline-show-fill-affects-fill-rendering
        type: affects
        from: layout.sparklines[].sparkline.show.fill
        to: '@sparkline-fill-rendering'
        description: show.fill selects solid versus fade fill treatment for fill-capable graph rendering.
      - id: sparkline-line-minmax-show-activates-envelope
        type: activates
        from: layout.sparklines[].sparkline.line.show.minmax
        to: layout.sparklines[].sparkline.line.minmax
        description: Enables the line minimum/maximum envelope configuration.
        when:
          equals: true
      - id: sparkline-area-minmax-show-activates-envelope
        type: activates
        from: layout.sparklines[].sparkline.area.show.minmax
        to: layout.sparklines[].sparkline.area.minmax
        description: Enables the area minimum/maximum envelope configuration.
        when:
          equals: true
      - id: sparkline-show-background-activates-radial-background
        type: activates
        from: layout.sparklines[].sparkline.show.background
        to: layout.sparklines[].sparkline.radial.background|radial_barcode.background
        description: For radial families, show.background controls the configured radial plot/background 
          layer.
        when:
          equals: true
      - id: sparkline-state-bands-requires-state-map
        type: requires
        from: layout.sparklines[].sparkline.show.chart_type
        to: layout.sparklines[].sparkline.state_map
        description: state_bands maps categorical history rows through sparkline.state_map for band 
          levels/labels.
        when:
          equals: state_bands
      - id: sparkline-state-bands-forces-hard-color-transition
        type: overrides
        from: layout.sparklines[].sparkline.show.chart_type
        to: layout.sparklines[].sparkline.colorstops_transition
        description: When chart_type is state_bands, runtime forces hard color-stop transitions because states
          are discrete.
        when:
          equals: state_bands
        resolution: The effective transition becomes hard.
      - id: sparkline-series-inherits-parent-config
        type: fallback
        from: layout.sparklines[].series[]
        to: layout.sparklines[]
        description: Every explicit series starts from the complete normalized parent sparkline configuration 
          and deep-merges its own overrides.
      - id: sparkline-series-chart-type-overrides-parent
        type: overrides
        from: layout.sparklines[].series[].sparkline.show.chart_type
        to: layout.sparklines[].sparkline.show.chart_type
        description: An explicit series may override the parent chart_type with line, area, dots, bar or 
          radial.
      - id: sparkline-series-chart-variant-overrides-parent
        type: overrides
        from: layout.sparklines[].series[].sparkline.show.chart_variant
        to: layout.sparklines[].sparkline.show.chart_variant
        description: A radial series may override the inherited line/area/dots chart_variant.
      - id: sparkline-series-item-style-overrides-parent
        type: overrides
        from: layout.sparklines[].series[].sparkline.show.item_style
        to: layout.sparklines[].sparkline.show.item_style
        description: A series-wide item_style replaces the inherited shared paint choice unless a deeper 
          line/area/minmax item_style is explicitly configured.
      - id: sparkline-series-y-axis-id-selects-axis-group
        type: references
        from: layout.sparklines[].series[].y_axis_id
        to: '@sparkline-y-axis-group'
        description: y_axis_id assigns the series to the primary or secondary shared Y-axis group; the default
          is primary.
      - id: sparkline-series-period-offset-overrides-parent
        type: overrides
        from: layout.sparklines[].series[].period.<active-period>.offset
        to: layout.sparklines[].period.<active-period>.offset
        description: An explicit series may override only the offset of the parent-selected 
          calendar/rolling_window period branch; duration and bins stay parent-owned.
      - id: sparkline-radial-series-require-radial-parent
        type: requires
        from: layout.sparklines[].series[].sparkline.show.chart_type
        to: layout.sparklines[].sparkline.show.chart_type
        description: Radial series cannot be mixed with cartesian series, and the parent chart_type must be 
          radial when all explicit series are radial.
        when:
          equals: radial
      - id: sparkline-radial-series-share-parent-geometry
        type: fallback
        from: layout.sparklines[].series[].sparkline.radial
        to: layout.sparklines[].sparkline.radial
        description: Radial geometry is parent-owned and shared by radial series; runtime rejects a 
          series-local sparkline.radial block.
        resolution: Configure radial geometry only on the parent sparkline.
      - id: sparkline-explicit-series-chart-types-are-limited
        type: requires
        from: layout.sparklines[].series[].sparkline.show.chart_type
        to: '@supported-explicit-series-chart-type'
        description: Explicit multi-series items support line, area, dots, bar and radial chart types; 
          equalizer/graded/barcode/state_bands/radial_barcode are parent/single-series families.
      - id: horseshoe-show-activates-gauge
        type: activates
        from: layout.horseshoes[].show.horseshoe
        to: layout.horseshoes[]
        description: A horseshoe with show.horseshoe false is filtered out during tool creation; true/default 
          keeps the gauge active.
        when:
          not_equals: false
      - id: horseshoe-show-tickmarks-activates-tickmark-config
        type: activates
        from: layout.horseshoes[].show.tickmarks
        to: layout.horseshoes[].horseshoe_tickmarks
        description: show.tickmarks is the primary tickmark visibility selector. A boolean controls both 
          layers; {major, minor} controls them independently.
      - id: horseshoe-legacy-ticks-fallback
        type: fallback
        from: layout.horseshoes[].show.tickmarks
        to: layout.horseshoes[].show.ticks
        description: Legacy show.ticks is consulted only when show.tickmarks is absent.
      - id: horseshoe-legacy-scale-tickmarks-can-generate-major-config
        type: provides
        from: layout.horseshoes[].show.scale_tickmarks
        to: layout.horseshoes[].horseshoe_tickmarks.ticks_major
        description: 'Legacy scale_tickmarks: true can synthesize major tickmark geometry from horseshoe_scale when
          no explicit major/minor tickmark block exists.'
        when:
          equals: true
      - id: horseshoe-labels-at-selects-label-layer
        type: activates
        from: layout.horseshoes[].show.labels_at
        to: layout.horseshoes[].horseshoe_labels
        description: labels_at selects where horseshoe labels are generated. The default none keeps the label 
          layer inactive.
      - id: horseshoe-state-mode-selects-label-mode-config
        type: activates
        from: layout.horseshoes[].horseshoe_state.mode
        to: layout.horseshoes[].horseshoe_labels.<mode>
        description: String-state modes select the matching horseshoe_labels.stringstate_mode or 
          stringstate_level configuration.
      - id: horseshoe-path-type-selects-path-geometry
        type: activates
        from: layout.horseshoes[].path.type
        to: layout.horseshoes[].path.<type-fields>
        description: path.type selects the generic path generator. Current families are arc, line, rectangle, 
          polygon, wave, spiral and infinity.
      - id: horseshoe-center-marker-requires-icon
        type: requires
        from: layout.horseshoes[].horseshoe_marker.attach_to
        to: layout.horseshoes[].horseshoe_marker.icon
        description: A center-attached marker represents a pointer from the path center and requires an 
          explicit icon.
        when:
          equals: center
      - id: horseshoe-center-marker-requires-arc-path
        type: requires
        from: layout.horseshoes[].horseshoe_marker.attach_to
        to: layout.horseshoes[].path.type
        description: A center-attached marker is valid only for an arc path.
        when:
          equals: center
          path_type: arc
      - id: horseshoe-marker-icon-and-shape-are-exclusive
        type: requires
        from: layout.horseshoes[].horseshoe_marker.icon
        to: layout.horseshoes[].horseshoe_marker.shape
        description: Marker icon and shape are mutually exclusive; configure one visual source, not both.
        when:
          mutually_exclusive: true
      - id: horseshoe-path-marker-shape-fallback-circle
        type: fallback
        from: layout.horseshoes[].horseshoe_marker.shape
        to: circle
        description: 'For attach_to: path, if neither icon nor shape is supplied, the marker defaults to a circle.'
      - id: horseshoe-absolute-bar-requires-cross-zero-scale
        type: requires
        from: layout.horseshoes[].bar_mode
        to: layout.horseshoes[].horseshoe_scale.min|max
        description: absolute bar mode requires scale min <= 0 and max > 0.
        when:
          equals: absolute
      - id: horseshoe-absolute-bar-forbids-zero-ratio
        type: requires
        from: layout.horseshoes[].bar_mode
        to: layout.horseshoes[].zero_ratio
        description: absolute bar mode uses the physical path start as zero and rejects an explicit 
          zero_ratio.
        when:
          equals: absolute
          must_be_absent: true
      - id: horseshoe-symmetrical-bar-zero-ratio-fallback
        type: fallback
        from: layout.horseshoes[].zero_ratio
        to: '0.5'
        description: bidirectional and bidirectional_symmetrical default zero_ratio to 0.5 when it is not 
          explicitly supplied.
        when:
          bar_mode_in:
            - bidirectional
            - bidirectional_symmetrical
      - id: horseshoe-derived-zero-ratio-fallback
        type: fallback
        from: layout.horseshoes[].zero_ratio
        to: '@derived-scale-zero-ratio'
        description: Other non-absolute modes derive the zero position from horseshoe_scale min/max when 
          zero_ratio is omitted.
      - id: horseshoe-bidirectional-gradient-requires-both-sign-stops
        type: requires
        from: layout.horseshoes[].show.horseshoe_style
        to: layout.horseshoes[].color_stops
        description: Gradient horseshoe styles used with bidirectional/absolute ranges spanning zero require 
          color stops on the needed negative and positive sides.
        when:
          style_in:
            - autominmax
            - minmaxgradient
            - lineargradient
          bar_mode_in:
            - bidirectional
            - bidirectional_symmetrical
            - bidirectional_linear
            - absolute
      - id: slider-item-viz-activates-nested-viz-block
        type: activates
        from: layout.controls[type=slider].show.item_viz
        to: layout.controls[type=slider].linear|circular
        description: show.item_viz selects the matching nested linear or circular visualization block.
      - id: slider-single-variant-binds-primary-entity
        type: provides
        from: layout.controls[type=slider].entity_index
        to: layout.controls[type=slider].values[0].entity_index
        description: For item_variant single, runtime creates one internal value binding from the slider's 
          entity_index.
        when:
          item_variant: single
      - id: slider-range-first-value-becomes-primary-binding
        type: affects
        from: layout.controls[type=slider].values[0].entity_index
        to: layout.controls[type=slider].entity_index
        description: For item_variant range, runtime uses the first of the two values as the slider's primary 
          entity_index.
        when:
          item_variant: range
      - id: slider-value-show-activates-value-display
        type: activates
        from: layout.controls[type=slider].value.show
        to: layout.controls[type=slider].value.state
        description: value.show controls creation/rendering of StateTool value labels; 
          value.position/gap/offset then place them.
        when:
          equals: true
      - id: number-control-item-variant-selects-stepper
        type: requires
        from: layout.controls[type=number].show.item_variant
        to: stepper
        description: Current number control supports the stepper variant.
      - id: number-control-item-viz-selects-buttons
        type: requires
        from: layout.controls[type=number].show.item_viz
        to: buttons
        description: Current number control supports the buttons visualization.
      - id: number-control-content-mode-selects-layout
        type: activates
        from: layout.controls[type=number].content.mode
        to: layout.controls[type=number].content.content_horizontal|content_vertical
        description: content.mode selects the horizontal or vertical number-control content layout; each 
          layout owns minus, value and plus subconfiguration.
      - id: sparkline-color-stops-provide-palette
        type: provides
        from: layout.sparklines[].sparkline.color_stops
        to: '@sparkline-color-palette'
        description: Defines the public color-stop palette for sparkline graph rendering; BaseTool normalizes 
          it into sparkline.colorstops at the runtime-config boundary.
      - id: sparkline-item-style-activates-color-palette
        type: activates
        from: layout.sparklines[].sparkline.show.item_style
        to: '@sparkline-color-palette'
        description: Sparkline item_style color modes select how the graph consumes its color stops.
        when:
          in:
            - colorstop
            - colorstopinterpolated
            - colorstopgradient
      - id: fhs-local-entity-domain-requires-object-id
        type: requires
        from: entities[].entity
        to: '@complete-entity-id'
        description: fhs_input_number, fhs_input_boolean and fhs_input_select are domains. A configured local 
          entity must use domain.object_id, for example fhs_input_number.horseshoe_width; the bare domain is 
          not an entity id.
      - id: fhs-local-input-defined-in-entities
        type: requires
        from: '@fhs-local-input'
        to: entities[]
        description: FHS-local inputs are ordinary entity entries in the card entities list. Do not create 
          nested fhs_input_number/fhs_input_boolean/fhs_input_select blocks under controls.
      - id: fhs-local-number-provides-control-metadata
        type: provides
        from: entities[entity=fhs_input_number.*].min|max|step
        to: layout.controls[type=number|slider]
        description: A bound fhs_input_number exposes its configured numeric metadata to number and slider 
          controls.
      - id: fhs-local-control-binding-uses-entity-index
        type: references
        from: layout.controls[].entity_index
        to: entities[]
        description: Controls bind FHS-local inputs through the same entity_index mechanism as other 
          configured card entities.
      - id: fhs-local-entity-state-available-in-template-entities
        type: provides
        from: entities[entity=fhs_input_*.*]
        to: '@javascript-context.entities'
        description: Browser-local FHS entities participate in the card entity-state list and can be read from
          JavaScript through entities[index].state.
      - id: javascript-states-is-ha-state-registry
        type: references
        from: '@javascript-context.states'
        to: hass.states
        description: JavaScript states refers specifically to the Home Assistant state registry. It is not an 
          alias for the FHS card entities list.
      - id: javascript-entities-is-card-entity-list
        type: references
        from: '@javascript-context.entities'
        to: entities[]
        description: JavaScript entities is the resolved FHS card entity-state list in configured order.
      - id: javascript-template-return-must-fit-receiving-field
        type: requires
        from: '@javascript-template-return'
        to: '@receiving-field-contract'
        description: A runtime JavaScript template returns the complete value for its containing field and 
          must satisfy that field's documented value/type semantics.
      - id: slider-interaction-does-not-own-step
        type: requires
        from: layout.controls[type=slider].interaction
        to: '@slider-interaction-contract'
        description: Slider interaction owns update_interval and haptic behavior. Numeric step belongs to 
          slider.scale.step or the bound entity's step metadata.
      - id: slider-scale-falls-back-to-bound-entity-metadata
        type: fallback
        from: layout.controls[type=slider].scale.min|max|step
        to: entities[entity_index].attributes.min|max|step
        description: When explicit slider scale values are absent, runtime resolves min/max/step from 
          attributes of the primary bound entity.
      - id: sparkline-barcode-chart-variant-values
        type: requires
        from: layout.sparklines[].sparkline.show.chart_variant
        to: '@barcode-variant'
        description: For chart_type barcode, static chart_variant is audio, stalactites or stalagmites; 
          otherwise omit it.
        when:
          chart_type: barcode
      - id: sparkline-graded-chart-variant-values
        type: requires
        from: layout.sparklines[].sparkline.show.chart_variant
        to: '@graded-variant'
        description: For chart_type graded, the documented static chart_variant is rank_order.
        when:
          chart_type: graded
      - id: sparkline-radial-barcode-chart-variant-values
        type: requires
        from: layout.sparklines[].sparkline.show.chart_variant
        to: '@radial-barcode-variant'
        description: For radial_barcode, chart_variant is fixed, sunburst, sunburst_centered, sunburst_outward
          or sunburst_inward.
        when:
          chart_type: radial_barcode
      - id: sparkline-radial-barcode-chart-viz-values
        type: requires
        from: layout.sparklines[].sparkline.show.chart_viz
        to: '@radial-barcode-viz'
        description: For radial_barcode, chart_viz is bar, flower, flower2 or rice_grain.
        when:
          chart_type: radial_barcode
      - id: sparkline-nonapplicable-selectors-are-omitted
        type: requires
        from: layout.sparklines[].sparkline.show.chart_type
        to: '@chart-selector-applicability'
        description: Do not emit chart_variant or chart_viz for a chart family that does not define that 
          selector. Omit the field instead of inventing values such as default, none or standard.
      - id: styles-use-svg-rendering-semantics
        type: requires
        from: '*.styles'
        to: '@svg-css-presentation-semantics'
        description: FHS visual tools render as SVG. General SVG/CSS presentation semantics may be used inside
          style dictionaries, but this does not authorize HTML-only layout assumptions or new FHS 
          configuration fields.
      - id: javascript-states-reference-should-be-listed-entity
        type: requires
        from: "@javascript-context.states['<entity_id>']"
        to: entities[].entity
        description: When JavaScript reads a Home Assistant entity through states, include that entity in the 
          card entities list so Home Assistant state changes participate in the card update lifecycle.

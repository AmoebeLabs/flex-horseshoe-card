type: custom:flex-horseshoe-card
entities:
  - entity: sensor.awair_element_study_carbon_dioxide
    name: CO2
    unit: ppm
layout:
  horseshoes:
    - id: co2
      entity_index: 0
      xpos: 50
      ypos: 50
      radius: 42
      arc_degrees: 260
      show:
        horseshoe_style: colorstopinterpolated
      horseshoe_scale:
        min: 400
        max: 2000
        ticksize: 200
      horseshoe_state:
        width: 12
      color_stops:
        colors:
          400: '#2e7d32'
          1000: '#f9a825'
          1600: '#d32f2f'
  states:
    - id: value
      entity_index: 0
      xpos: 50
      ypos: 60
      show:
        uom: end
      styles:
        font-size: 2.1em
        text-anchor: middle

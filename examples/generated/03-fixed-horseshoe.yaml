type: custom:flex-horseshoe-card
entities:
  - entity: sensor.awair_element_study_score
    name: Air quality score
    unit: '%'
layout:
  horseshoes:
    - id: score
      entity_index: 0
      xpos: 50
      ypos: 50
      radius: 42
      arc_degrees: 260
      show:
        horseshoe_style: fixed
      horseshoe_scale:
        min: 0
        max: 100
      horseshoe_state:
        width: 12
  states:
    - id: value
      entity_index: 0
      xpos: 50
      ypos: 58
      show:
        uom: end
      styles:
        font-size: 2.4em
        text-anchor: middle

type: custom:flex-horseshoe-card
entities:
  - entity: sensor.dsmr_reading_electricity_currently_delivered
    name: Power
    unit: W
layout:
  sparklines:
    - id: realtime
      entity_index: 0
      xpos: 50
      ypos: 55
      width: 70
      height: 55
      period:
        type: real_time
      sparkline:
        show:
          chart_type: bar
        color_stops:
          0: '#43a047'
          2000: '#f9a825'
          4000: '#e53935'
        bar:
          foreground:
            styles:
              rx: 3
              ry: 3


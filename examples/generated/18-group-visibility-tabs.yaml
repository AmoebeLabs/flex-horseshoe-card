type: custom:flex-horseshoe-card
entities:
  - entity: fhs_input_number.active_tab
    initial: 0
    scope: global
    unit: ''
layout:
  groups:
    - id: first
      xpos: 50
      ypos: 50
      visibility: '[[[ return Number(entities[0].state) === 0 ? "visible" : "hidden"; ]]]'
    - id: second
      xpos: 50
      ypos: 50
      visibility: '[[[ return Number(entities[0].state) === 1 ? "visible" : "hidden"; ]]]'
  texts:
    - id: first-label
      group: first
      entity_index: 0
      xpos: 50
      ypos: 50
      text: First tab
      styles:
        text-anchor: middle
        dominant-baseline: central
    - id: second-label
      group: second
      entity_index: 0
      xpos: 50
      ypos: 50
      text: Second tab
      styles:
        text-anchor: middle
        dominant-baseline: central


type: custom:flex-horseshoe-card
entities:
  - entity: sensor.awair_element_study_temperature
    name: Temperature
    unit: C
layout:
  sparklines:
    - id: history
      entity_index: 0
      xpos: 50
      ypos: 55
      width: 88
      height: 42
      period:
        type: rolling_window
        rolling_window:
          duration:
            hour: 24
          bins:
            per_hour: auto
            density: medium
      sparkline:
        show:
          chart_type: area
          line: true
          area: true
          grid: true
          axis: true
          labels: true
        state_values:
          aggregate_func: avg
        color_stops:
          10: '#1565c0'
          24: '#66bb6a'
          35: '#d32f2f'


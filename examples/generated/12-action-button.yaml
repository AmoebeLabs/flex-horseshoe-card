type: custom:flex-horseshoe-card
entities:
  - entity: fhs_input_number.history_hours
    initial: 24
    scope: global
    unit: h
layout:
  rectangles:
    - id: button
      entity_index: 0
      xpos: 50
      ypos: 50
      width: 46
      height: 24
      radius: 3
      tap_action:
        haptic: selection
        action: perform-action
        perform_action: fhs_input_number.set_value
        target:
          entity_id: fhs_input_number.history_hours
        data:
          value: 24
      styles:
        fill: var(--primary-color)
        fill-opacity: 0.2
  texts:
    - id: label
      entity_index: 0
      xpos: 50
      ypos: 50
      text: History
      styles:
        text-anchor: middle
        dominant-baseline: central
        pointer-events: none


type: custom:flex-horseshoe-card
entities:
  - entity: sensor.awair_element_study_humidity
    name: Yesterday
    unit: '%'
layout:
  sparklines:
    - id: yesterday
      entity_index: 0
      xpos: 50
      ypos: 55
      width: 88
      height: 42
      period:
        type: calendar
        calendar:
          period: day
          offset: -1
          duration:
            hour: 24
          bins:
            per_hour: 4
        group_by: date
      sparkline:
        show:
          chart_type: line
          line: true
          grid: true
          axis: true
          labels: true


type: custom:flex-horseshoe-card
entities:
  - entity: sensor.awair_element_study_temperature
    name: Temperature
    unit: C
  - entity: sensor.awair_element_study_humidity
    name: Humidity
    unit: '%'
layout:
  sparklines:
    - id: temperature
      entity_index: 0
      xpos: 50
      ypos: 32
      width: 82
      height: 28
      period:
        type: rolling_window
        rolling_window:
          duration:
            hour: 24
          bins:
            per_hour: auto
            density: medium
      sparkline:
        show:
          chart_type: line
          labels: true
    - id: humidity
      entity_index: 1
      xpos: 50
      ypos: 70
      width: 82
      height: 28
      period:
        type: rolling_window
        rolling_window:
          duration:
            hour: 24
          bins:
            per_hour: auto
            density: medium
      sparkline:
        show:
          chart_type: area
          labels: true


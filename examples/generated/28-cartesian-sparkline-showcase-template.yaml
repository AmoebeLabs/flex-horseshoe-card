fhs_showcase_cartesian:
  template:
    type: card
    defaults:
      - entity: sensor.awair_element_study_temperature
      - name: Cartesian sparkline showcase
      - unit: C
  card:
    default_entities:
      - entity: fhs_input_number.showcase_cartesian_type
        slot: chart_type
        initial: 0
        scope: global
        unit: ''
      - entity: fhs_input_boolean.showcase_cartesian_axis
        slot: show_axis
        initial: true
        scope: card
      - entity: fhs_input_boolean.showcase_cartesian_labels
        slot: show_labels
        initial: true
        scope: card
      - entity: fhs_input_boolean.showcase_cartesian_tickmarks
        slot: show_tickmarks
        initial: true
        scope: card
      - entity: fhs_input_boolean.showcase_cartesian_grid
        slot: show_grid
        initial: true
        scope: card
      - entity: fhs_input_boolean.showcase_cartesian_points
        slot: show_points
        initial: true
        scope: card
      - entity: fhs_input_boolean.showcase_cartesian_minmax
        slot: show_minmax
        initial: true
        scope: card
      - entity: '[[entity]]'
        slot: source
        name: '[[name]]'
        unit: '[[unit]]'
    constants:
      chart_types: [line, area, bar, dots]
      get_value_from_item_id: |
        [[[ return Number(item.id.split('--value-')[1]); ]]]
    layout:
      aspectratio: 1/1.5
      groups:
        - id: title
          xpos: 50
          ypos: 7
        - id: chart
          xpos: 50
          ypos: 55
        - id: controls
          xpos: 50
          ypos: 128
        - id: options
          xpos: 50
          ypos: 143
      sparklines:
        - id: showcase
          group: chart
          entity_index: source[0]
          xpos: 50
          ypos: 50
          width: 88
          height: 72
          margin: 0
          period:
            type: rolling_window
            rolling_window:
              duration:
                hour: 24
              bins:
                per_hour: auto
                density: medium
          sparkline:
            state_values:
              aggregate_func: avg
            show:
              chart_type: '[[[ return constants.chart_types[Number(entities[entity_slots.chart_type[0]].state)]; ]]]'
              line: true
              area: true
              points: |
                [[[ return entities[entity_slots.show_points[0]].state === 'on'; ]]]
              grid: |
                [[[ return entities[entity_slots.show_grid[0]].state === 'on'; ]]]
              axis: |
                [[[ return entities[entity_slots.show_axis[0]].state === 'on'; ]]]
              tickmarks: |
                [[[ return entities[entity_slots.show_tickmarks[0]].state === 'on'; ]]]
              labels: |
                [[[ return entities[entity_slots.show_labels[0]].state === 'on'; ]]]
              xlabels_at: ticks_major
              ylabels_at: ticks_major
            line:
              line_width: 1
              show_minmax: |
                [[[ return entities[entity_slots.show_minmax[0]].state === 'on'; ]]]
            dots:
              radius: 1
            area:
              show_minmax: |
                [[[ return entities[entity_slots.show_minmax[0]].state === 'on'; ]]]
            color_stops:
              0: '#1565c0'
              10: '#42a5f5'
              20: '#66bb6a'
              30: '#f9a825'
              40: '#d32f2f'
          x_axis:
            labels:
              styles:
                font-size: 0.5em
          y_axis:
            labels:
              styles:
                font-size: 0.5em
      texts:
        - id: title
          group: title
          xpos: 50
          ypos: 50
          text: '[[name]]'
          styles:
            font-size: 1.2em
            font-weight: bold
            text-anchor: middle
            dominant-baseline: central
        - id: type--value-0
          group: controls
          entity_index: chart_type[0]
          xpos: 10
          ypos: 50
          text: Line
          styles:
            font-size: 0.65em
            text-anchor: middle
            dominant-baseline: central
            pointer-events: none
        - id: type--value-1
          same_as: type--value-0
          same_as_dxpos: 20
          text: Area
        - id: type--value-2
          same_as: type--value-1
          same_as_dxpos: 20
          text: Bar
        - id: type--value-3
          same_as: type--value-2
          same_as_dxpos: 20
          text: Dots
        - id: option-axis
          group: options
          entity_index: show_axis[0]
          xpos: 8
          ypos: 50
          text: Axis
          styles:
            font-size: 0.55em
            text-anchor: middle
            dominant-baseline: central
            pointer-events: none
            fill: "[[[ return state === 'on' ? 'var(--primary-background-color)' : 'var(--primary-text-color)'; ]]]"
        - id: option-labels
          same_as: option-axis
          same_as_dxpos: 16
          entity_index: show_labels[0]
          text: Labels
        - id: option-ticks
          same_as: option-labels
          same_as_dxpos: 16
          entity_index: show_tickmarks[0]
          text: Ticks
        - id: option-grid
          same_as: option-ticks
          same_as_dxpos: 16
          entity_index: show_grid[0]
          text: Grid
        - id: option-points
          same_as: option-grid
          same_as_dxpos: 16
          entity_index: show_points[0]
          visibility: |
            [[[ return Number(entities[entity_slots.chart_type[0]].state) === 3 ? 'hidden' : 'visible'; ]]]
          text: Points
        - id: option-minmax
          same_as: option-points
          same_as_dxpos: 16
          entity_index: show_minmax[0]
          visibility: |
            [[[ return Number(entities[entity_slots.chart_type[0]].state) <= 1 ? 'visible' : 'hidden'; ]]]
          text: Min/Max
      rectangles:
        - id: type--value-0
          group: controls
          entity_index: chart_type[0]
          xpos: 10
          ypos: 50
          width: 18
          height: 10
          radius: 2
          tap_action:
            haptic: selection
            action: perform-action
            perform_action: fhs_input_number.set_value
            target:
              entity_id: fhs_input_number.showcase_cartesian_type
            data:
              value: ref(get_value_from_item_id)
          styles:
            stroke-width: 1
            stroke: var(--divider-color)
            fill-opacity: 0.7
            fill: "[[[ return Number(state) === Number(item.id.split('--value-')[1]) ? 'var(--primary-color)' : 'var(--card-background-color)'; ]]]"
        - id: type--value-1
          same_as: type--value-0
          same_as_dxpos: 20
        - id: type--value-2
          same_as: type--value-1
          same_as_dxpos: 20

        - id: type--value-3
          same_as: type--value-2
          same_as_dxpos: 20
        - id: option-axis
          group: options
          entity_index: show_axis[0]
          xpos: 8
          ypos: 50
          width: 14
          height: 10
          radius: "[[[ return state === 'on' ? 5 : 2; ]]]"
          tap_action:
            haptic: selection
            action: toggle
          styles:
            stroke-width: 1
            stroke: var(--divider-color)
            fill-opacity: 0.7
            fill: "[[[ return state === 'on' ? 'var(--primary-color)' : 'var(--card-background-color)'; ]]]"
        - id: option-labels
          same_as: option-axis
          same_as_dxpos: 16
          entity_index: show_labels[0]
        - id: option-ticks
          same_as: option-labels
          same_as_dxpos: 16
          entity_index: show_tickmarks[0]
        - id: option-grid
          same_as: option-ticks
          same_as_dxpos: 16
          entity_index: show_grid[0]
        - id: option-points
          same_as: option-grid
          same_as_dxpos: 16
          entity_index: show_points[0]
          visibility: |
            [[[ return Number(entities[entity_slots.chart_type[0]].state) === 3 ? 'hidden' : 'visible'; ]]]
        - id: option-minmax
          same_as: option-points
          same_as_dxpos: 16
          entity_index: show_minmax[0]
          visibility: |
            [[[ return Number(entities[entity_slots.chart_type[0]].state) <= 1 ? 'visible' : 'hidden'; ]]]

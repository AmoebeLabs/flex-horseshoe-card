type: custom:flex-horseshoe-card
entities:
  - entity: sensor.battery_power
    name: Battery power
    unit: W
layout:
  horseshoes:
    - id: power
      entity_index: 0
      xpos: 50
      ypos: 50
      radius: 42
      arc_degrees: 260
      bar_mode: bidirectional
      show:
        horseshoe_style: lineargradient
      horseshoe_scale:
        min: -500
        max: 500
      horseshoe_state:
        width: 12
      color_stops:
        colors:
          - value: -500
            color: '#d32f2f'
          - value: 0
            color: '#757575'
          - value: 500
            color: '#2e7d32'
  states:
    - id: value
      entity_index: 0
      xpos: 50
      ypos: 58
      show:
        uom: end
      styles:
        font-size: 2.2em
        text-anchor: middle

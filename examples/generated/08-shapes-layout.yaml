type: custom:flex-horseshoe-card
entities:
  - entity: sensor.awair_element_study_temperature
    name: Study
    unit: C
layout:
  rectangles:
    - id: frame
      xpos: 50
      ypos: 50
      width: 82
      height: 62
      radius: 4
      styles:
        fill: none
        stroke: var(--primary-color)
        stroke-width: 1
    - id: value-background
      xpos: 50
      ypos: 62
      width: 42
      height: 20
      radius: 3
      styles:
        fill: var(--primary-color)
        fill-opacity: 0.15
  circles:
    - id: indicator
      xpos: 50
      ypos: 29
      radius: 8
      styles:
        fill: var(--primary-color)
        fill-opacity: 0.25
        stroke: var(--primary-color)
        stroke-width: 1
  lines:
    - id: separator
      orientation: horizontal
      xpos: 50
      ypos: 43
      length: 60
      styles:
        stroke: var(--divider-color)
  names:
    - id: name
      entity_index: 0
      xpos: 50
      ypos: 30
      styles:
        text-anchor: middle
  states:
    - id: state
      entity_index: 0
      xpos: 50
      ypos: 63
      show:
        uom: end
      styles:
        font-size: 1.7em
        text-anchor: middle


fhs_showcase_cartesian_v2:
  template:
    type: card
    defaults:
      - entity: sensor.awair_element_study_temperature
      - name: Cartesian sparkline showcase
      - unit: C

  card:
    default_entities:
      - entity: fhs_input_number.showcase_cartesian_type
        slot: chart_type
        initial: 0
        min: 0
        max: 3
        step: 1
        scope: global
        unit: ''
      - entity: fhs_input_boolean.showcase_cartesian_axis
        slot: show_axis
        initial: true
        scope: card
      - entity: fhs_input_boolean.showcase_cartesian_labels
        slot: show_labels
        initial: true
        scope: card
      - entity: fhs_input_boolean.showcase_cartesian_tickmarks
        slot: show_tickmarks
        initial: true
        scope: card
      - entity: fhs_input_boolean.showcase_cartesian_grid
        slot: show_grid
        initial: true
        scope: card
      - entity: fhs_input_boolean.showcase_cartesian_points
        slot: show_points
        initial: true
        scope: card
      - entity: fhs_input_boolean.showcase_cartesian_minmax
        slot: show_minmax
        initial: true
        scope: card
      - entity: '[[entity]]'
        slot: source
        name: '[[name]]'
        unit: '[[unit]]'

    constants:
      chart_types:
        - line
        - area
        - bar
        - dots

    layout:
      aspectratio: 1/1.5

      groups:
        - id: title
          xpos: 50
          ypos: 7
        - id: chart
          xpos: 50
          ypos: 55

      sparklines:
        - id: showcase
          group: chart
          entity_index: source[0]
          xpos: 50
          ypos: 50
          width: 88
          height: 72
          margin: 0
          period:
            type: rolling_window
            rolling_window:
              duration:
                hour: 24
              bins:
                per_hour: auto
                density: medium
          sparkline:
            state_values:
              aggregate_func: avg
            show:
              chart_type: |
                [[[
                  return constants.chart_types[
                    Number(entities[entity_slots.chart_type[0]].state)
                  ];
                ]]]
              line: true
              area: true
              points: |
                [[[ return entities[entity_slots.show_points[0]].state === 'on'; ]]]
              grid: |
                [[[ return entities[entity_slots.show_grid[0]].state === 'on'; ]]]
              axis: |
                [[[ return entities[entity_slots.show_axis[0]].state === 'on'; ]]]
              tickmarks: |
                [[[ return entities[entity_slots.show_tickmarks[0]].state === 'on'; ]]]
              labels: |
                [[[ return entities[entity_slots.show_labels[0]].state === 'on'; ]]]
              xlabels_at: ticks_major
              ylabels_at: ticks_major
            line:
              line_width: 1
              show_minmax: |
                [[[ return entities[entity_slots.show_minmax[0]].state === 'on'; ]]]
            dots:
              radius: 1
            area:
              show_minmax: |
                [[[ return entities[entity_slots.show_minmax[0]].state === 'on'; ]]]
            color_stops:
              0: '#1565c0'
              10: '#42a5f5'
              20: '#66bb6a'
              30: '#f9a825'
              40: '#d32f2f'
          x_axis:
            labels:
              styles:
                font-size: 0.5em
          y_axis:
            labels:
              styles:
                font-size: 0.5em

      texts:
        - id: title
          group: title
          xpos: 50
          ypos: 50
          text: '[[name]]'
          styles:
            font-size: 1.2em
            font-weight: bold
            text-anchor: middle
            dominant-baseline: central

      controls:
        - id: chart-type
          type: select
          entity_index: chart_type[0]
          xpos: 50
          ypos: 128
          width: 80
          height: 10
          content:
            mode: content_vertical
            content_vertical:
              text:
                styles:
                  font-size: 0.65em
          option_map:
            - { value: 0, text: Line }
            - { value: 1, text: Area }
            - { value: 2, text: Bar }
            - { value: 3, text: Dots }

        - id: show-axis
          type: toggle
          entity_index: show_axis[0]
          xpos: 8
          ypos: 143
          width: 10
          label:
            position: top
            gap: 1
            text: Axis
            styles:
              font-size: 0.46em

        - id: show-labels
          same_as: show-axis
          same_as_dxpos: 16
          entity_index: show_labels[0]
          label:
            text: Labels

        - id: show-tickmarks
          same_as: show-labels
          same_as_dxpos: 16
          entity_index: show_tickmarks[0]
          label:
            text: Ticks

        - id: show-grid
          same_as: show-tickmarks
          same_as_dxpos: 16
          entity_index: show_grid[0]
          label:
            text: Grid

        - id: show-points
          same_as: show-grid
          same_as_dxpos: 16
          entity_index: show_points[0]
          visibility: |
            [[[
              return Number(entities[entity_slots.chart_type[0]].state) === 3
                ? 'unavailable'
                : 'visible';
            ]]]
          label:
            text: Points

        - id: show-minmax
          same_as: show-points
          same_as_dxpos: 16
          entity_index: show_minmax[0]
          visibility: |
            [[[
              return Number(entities[entity_slots.chart_type[0]].state) <= 1
                ? 'visible'
                : 'unavailable';
            ]]]
          label:
            text: Min/Max

          #     padding: 2
          #     minus:
          #       text: '-'
          #       mode: text
          #     value:
          #       text_overflow:
          #         mode: fit
          #         fit:
          #           max_width: 18
          #     plus:
          #       text: '+'
          #       mode: text

        - id: demo-number-icons
          type: number
          entity_index: 2
          xpos: 50
          ypos: 15
          width: 30
          height: 10
          show:
            item_variant: stepper
            item_viz: buttons
            item_style: outlined_round
          content:
            mode: content_horizontal
            content_horizontal:
              minus:
                mode: content_icon
              plus:
                mode: content_icon

        - id: demo-number-icons-v
          type: number
          orientation: vertical
          entity_index: 2
          xpos: 75
          ypos: 15
          width: 30
          height: 10
          show:
            item_variant: stepper
            item_viz: buttons
            item_style: filled_round
          content:
            mode: content_horizontal
            content_horizontal: content_icon

        - id: demo-number-icons-v2
          type: number

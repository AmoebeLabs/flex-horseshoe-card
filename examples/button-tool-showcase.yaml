        - id: demo-number-text
          type: number
          entity_index: 2
          xpos: 15
          ypos: 15
          width: 30
          height: 10
          show:
            item_variant: stepper
            item_viz: buttons
            item_style: filled_square
          # content:
          #   mode: content_horizontal

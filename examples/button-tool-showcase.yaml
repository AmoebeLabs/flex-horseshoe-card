          option_map:
            - value: 'off'
              icon: mdi:fan-off
              text: 'Off'
            - value: low
              icon: mdi:fan-speed-1
              text: Low
            - value: medium
              icon: mdi:fan-speed-2
              text: Medium
            - value: high
              icon: mdi:fan-speed-3
              text: High

        - id: fan-mode3
          type: select
          orientation: horizontal
          entity_index: 1
          xpos: 50
          ypos: 110
          width: 70
          height: 15

          show:
            item_variant: segmented
            item_viz: viz_line
            item_style: outlined_square

          background:

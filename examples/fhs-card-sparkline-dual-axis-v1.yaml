# Phase 7 visual test: primary and secondary y axes with independent bounds.
type: custom:flex-horseshoe-card
entities:
  - entity: sensor.awair_element_livingroom_temperature
    name: Livingroom temperature
    unit: C
  - entity: sensor.awair_element_bedroom_temperature
    name: Bedroom temperature
    unit: C
  - entity: sensor.awair_element_study_humidity
    name: Study humidity
    unit: %

layout:
  aspectratio: 1/1.35

  groups:
    - id: title
      xpos: 50
      ypos: 8
    - id: chart
      xpos: 50
      ypos: 56

  texts:
    - id: title
      group: title
      xpos: 50
      ypos: 50
      text: Dual y-axis sparkline
      styles:
        font-size: 1.1em
        font-weight: bold
        text-anchor: middle
        dominant-baseline: central

  sparklines:
    - id: dual-axis-comparison
      group: chart
      entity_index: 0
      xpos: 50
      ypos: 50
      width: 88
      height: 78
      margin: 1
      period:
        type: rolling_window
        rolling_window:
          duration:
            hour: 24
          bins:
            per_hour: auto
            density: medium
      sparkline:
        state_values:
          aggregate_func: avg
        show:
          chart_type: line
          line: true
          grid: true
          axis: true
          tickmarks: true
          labels: true
          legend: true
          xlabels_at: ticks_major
          ylabels_at: ticks_major
        line:
          line_width: 1.5
        legend:
          position: top
          rows: 2
          gap: 1
      x_axis:
        labels:
          styles:
            font-size: 0.5em
      y_axis:
        labels:
          styles:
            font-size: 0.5em
      series:
        - id: livingroom-temperature
          entity_index: 0
          color: "#42a5f5"
          y_axis_id: primary
        - id: bedroom-temperature
          entity_index: 1
          color: "#f9a825"
          y_axis_id: primary
        - id: study-humidity
          entity_index: 2
          color: "#66bb6a"
          y_axis_id: secondary
          sparkline:
            line:
              styles:
                stroke-dasharray: "4 2"

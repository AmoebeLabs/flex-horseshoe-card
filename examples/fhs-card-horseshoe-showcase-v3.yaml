fhs_card_horseshoe_showcase_v3:
  template:
    type: card
    defaults:
      - name: Horseshoe showcase
      - unit: C

  card:
    default_entities:
      - entity: fhs_input_select.showcase_horseshoe_style
        slot: style
        options:
          [
            fixed,
            autominmax,
            colorstop,
            colorstopinterpolated,
            colorstopsegments,
            minmaxgradient,
            colorstopgradient,
            lineargradient,
          ]
        initial: fixed
        scope: global
      - entity: fhs_input_select.showcase_horseshoe_bar_mode
        slot: bar_mode
        options:
          [
            normal,
            bidirectional,
            bidirectional_symmetrical,
            bidirectional_linear,
            absolute,
          ]
        initial: normal
        scope: global
      - entity: fhs_input_number.showcase_horseshoe_scale_min
        slot: scale_min
        initial: -10
        min: -15
        max: 45
        step: 1
        scope: card
        unit: ''
      - entity: fhs_input_number.showcase_horseshoe_scale_max
        slot: scale_max
        initial: 40
        min: -15
        max: 45
        step: 1
        scope: card
        unit: ''
      - entity: fhs_input_number.showcase_horseshoe_state
        slot: source
        initial: 20
        min: -20
        max: 50
        step: 1
        scope: card
        name: "[[name]]"
        unit: "[[unit]]"
      - entity: fhs_input_boolean.showcase_horseshoe_tickmarks
        slot: show_tickmarks
        initial: true
        scope: card
      - entity: fhs_input_boolean.showcase_horseshoe_labels
        slot: show_labels
        initial: true
        scope: card
      - entity: fhs_input_boolean.showcase_horseshoe_label_badges
        slot: show_label_badges
        initial: true
        scope: card
      - entity: fhs_input_boolean.showcase_horseshoe_tick_background
        slot: show_tick_background
        initial: true
        scope: card
      - entity: fhs_input_boolean.showcase_horseshoe_background
        slot: show_background
        initial: true
        scope: card
      - entity: fhs_input_number.showcase_horseshoe_labels_offset
        slot: labels_offset
        initial: 12
        min: -30
        max: 30
        step: 1
        scope: card
      - entity: fhs_input_number.showcase_horseshoe_ticks_offset
        slot: ticks_offset
        initial: 0
        min: -30
        max: 30
        step: 1
        scope: card
      - entity: fhs_input_number.showcase_horseshoe_tick_background_offset
        slot: tick_background_offset
        initial: 0
        min: -30
        max: 30
        step: 1
        scope: card
      - entity: fhs_input_number.showcase_horseshoe_background_offset
        slot: background_offset
        initial: 0
        min: -30
        max: 30
        step: 1
        scope: card
      - entity: fhs_input_select.showcase_horseshoe_tick_background_style
        slot: tick_background_style
        options: [none, fixed, colorstopsegments, colorstopgradient]
        initial: fixed
        scope: card
      - entity: fhs_input_select.showcase_horseshoe_background_style
        slot: background_style
        options: [none, fixed, colorstopsegments, colorstopgradient]
        initial: fixed
        scope: card
      - entity: fhs_input_number.showcase_horseshoe_width
        slot: horseshoe_width
        initial: 7
        min: 1
        max: 20
        step: 1
        scope: card
      - entity: fhs_input_number.showcase_horseshoe_scale_width
        slot: scale_width
        initial: 3
        min: 1
        max: 20
        step: 1
        scope: card
      - entity: fhs_input_select.showcase_horseshoe_scale_style
        slot: scale_style
        options:
          [none, fixed, colorstopsegments, colorstopgradient, lineargradient]
        initial: fixed
        scope: card
      - entity: fhs_input_number.showcase_horseshoe_major_ticks_width
        slot: major_ticks_width
        initial: 4
        min: 1
        max: 20
        step: 1
        scope: card
      - entity: fhs_input_number.showcase_horseshoe_minor_ticks_width
        slot: minor_ticks_width
        initial: 2
        min: 1
        max: 20
        step: 1
        scope: card
      - entity: fhs_input_number.showcase_horseshoe_minor_ticks_offset_delta
        slot: minor_ticks_offset_delta
        initial: 0
        min: -30
        max: 30
        step: 1
        scope: card

    constants:
      ypos_row_n1: 100
      ypos_row_0: 112
      ypos_row_1: 124
      ypos_row_2: 136
      ypos_row_3: 148
      ypos_row_4: 160
      ypos_row_5: 172
      ypos_row_6: 184
      ypos_row_7: 196
      ypos_row_8: 208
      ypos_row_9: 220
      ypos_row_10: 232

      select_width: 75

    layout:
      aspectratio: 1/2.4

      groups:
        - id: title
          xpos: 50
          ypos: 7
        - id: chart
          xpos: 50
          ypos: 55

      horseshoes:
        - id: showcase
          group: chart
          entity_index: source[0]
          xpos: 50
          ypos: 50
          radius: 32
          arc_degrees: 300
          bar_mode: |
            [[[ return entities[entity_slots.bar_mode[0]].state; ]]]
          horseshoe_state:
            width: |
              [[[ return Number(entities[entity_slots.horseshoe_width[0]].state); ]]]
            linecap: round
          horseshoe_scale:
            min: |
              [[[ return Number(entities[entity_slots.scale_min[0]].state); ]]]
            max: |
              [[[ return Number(entities[entity_slots.scale_max[0]].state); ]]]
            width: |
              [[[ return Number(entities[entity_slots.scale_width[0]].state); ]]]
            styles:
              opacity: 0.35
          show:
            horseshoe_style: |
              [[[ return entities[entity_slots.style[0]].state; ]]]
            scale_style: |
              [[[ return entities[entity_slots.scale_style[0]].state; ]]]
            tickmarks: |
              [[[ return entities[entity_slots.show_tickmarks[0]].state === 'on'; ]]]
            labels_at: |
              [[[
                return entities[entity_slots.show_labels[0]].state === 'on'
                  ? 'ticks_major'
                  : 'none';
              ]]]
            label_badges: |
              [[[ return entities[entity_slots.show_label_badges[0]].state === 'on'; ]]]
            tick_background: |
              [[[
                const enabled =
                  entities[entity_slots.show_tick_background[0]].state === 'on';
                const style =
                  entities[entity_slots.tick_background_style[0]].state;
                return enabled ? style : 'none';
              ]]]
            horseshoe_background: |
              [[[
                const enabled =
                  entities[entity_slots.show_background[0]].state === 'on';
                const style = entities[entity_slots.background_style[0]].state;
                return enabled ? style : 'none';
              ]]]
          horseshoe_background:
            offset: |
              [[[ return Number(entities[entity_slots.background_offset[0]].state); ]]]
            width: 16
            styles:
              fill: var(--divider-color)
              opacity: 0.2
          horseshoe_tickmarks:
            ticks_major:
              offset: |
                [[[ return Number(entities[entity_slots.ticks_offset[0]].state); ]]]
              ticksize: 10
              width: |
                [[[ return Number(entities[entity_slots.major_ticks_width[0]].state); ]]]
              thickness: 2
              color_mode: colorstop
            ticks_minor:
              offset: |
                [[[
                  return Number(entities[entity_slots.ticks_offset[0]].state)
                    + Number(entities[entity_slots.minor_ticks_offset_delta[0]].state);
                ]]]
              ticksize: 2
              width: |
                [[[ return Number(entities[entity_slots.minor_ticks_width[0]].state); ]]]
              thickness: 1
              styles:
                fill: var(--secondary-text-color)
                opacity: 0.5
            background:
              offset: |
                [[[
                  return Number(
                    entities[entity_slots.tick_background_offset[0]].state
                  );
                ]]]
              width: 7
              styles:
                fill: var(--divider-color)
                opacity: 0.2
          horseshoe_labels:
            offset: |
              [[[ return Number(entities[entity_slots.labels_offset[0]].state); ]]]
            badges:
              styles:
                fill: var(--card-background-color)
                stroke: var(--divider-color)
                stroke-width: 1
                opacity: 0.85
          color_stops:
            gap: 2
            scales:
              default:
                min: -10
                max: 40
            colors:
              -10: "purple"
              0: "#1565c0"
              10: "#42a5f5"
              20: "#66bb6a"
              30: "#f9a825"
              40: "#d32f2f"

      states:
        - id: value
          group: chart
          entity_index: source[0]
          xpos: 50
          ypos: 52
          show:
            uom: end
          styles:
            font-size: 2.6em
            text-anchor: middle
            dominant-baseline: central

      texts:
        - id: title
          group: title
          xpos: 50
          ypos: 50
          text: "[[name]]"
          styles:
            font-size: 1.2em
            font-weight: bold
            text-anchor: middle
            dominant-baseline: central

      controls:
        - id: scale-range
          type: slider
          values:
            - entity_index: scale_min[0]
            - entity_index: scale_max[0]
          xpos: 27
          ypos: calc(ypos_row_n1)
          width: 35
          height: 8
          interaction:
            update_interval: 0
          value:
            position: top
            gap: 2
            range_spacing: 8
            state:
              styles:
                font-size: 0.48em
          show:
            item_variant: range
            item_viz: linear
            item_style: ha
          label:
            position: start
            gap: 3
            text: Scale
            styles:
              font-size: 0.48em

        - id: state-value
          type: slider
          entity_index: source[0]
          xpos: 77
          ypos: calc(ypos_row_n1)
          width: 35
          height: 8
          interaction:
            update_interval: 0
          value:
            position: top
            gap: 2
            state:
              styles:
                font-size: 0.48em
          show:
            item_variant: single
            item_viz: linear
            item_style: ha
          label:
            position: start
            gap: 3
            text: State
            styles:
              font-size: 0.48em

        - id: bar-mode
          type: select
          entity_index: bar_mode[0]
          xpos: 58
          ypos: calc(ypos_row_0)
          width: calc(select_width)
          height: 9
          show:
            item_style: outlined_round
          label:
            position: start
            gap: 3
            text: Bar mode
            styles:
              font-size: 0.48em
          content:
            mode: content_vertical
            content_vertical:
              text:
                styles:
                  font-size: 0.38em
          option_map:
            - { value: normal, text: Normal }
            - { value: bidirectional, text: Bidir. }
            - { value: bidirectional_symmetrical, text: Symmetric }
            - { value: bidirectional_linear, text: Linear }
            - { value: absolute, text: Absolute }

        - id: horseshoe-style
          type: select
          entity_index: style[0]
          xpos: 58
          ypos: calc(ypos_row_2)
          width: calc(select_width)
          height: 9
          label:
            position: start
            gap: 3
            text: Horseshoe
            styles:
              font-size: 0.48em
          content:
            mode: content_vertical
            content_vertical:
              text:
                styles:
                  font-size: 0.42em
          option_map:
            - { value: fixed, text: Fixed }
            - { value: autominmax, text: Auto }
            - { value: colorstop, text: Stop }
            - { value: colorstopinterpolated, text: Interp. }
            - { value: colorstopsegments, text: Segments }
            - { value: minmaxgradient, text: Min/Max }
            - { value: colorstopgradient, text: Gradient }
            - { value: lineargradient, text: Linear }

        - id: tick-background-style
          type: select
          entity_index: tick_background_style[0]
          xpos: 58
          ypos: calc(ypos_row_3)
          width: calc(select_width)
          height: 9
          show:
            item_style: outlined_round
          label:
            position: start
            gap: 3
            text: Tick BG
            styles:
              font-size: 0.48em
          content:
            mode: content_vertical
            content_vertical:
              text:
                styles:
                  font-size: 0.42em
          option_map:
            - { value: none, text: None }
            - { value: fixed, text: Fixed }
            - { value: colorstopsegments, text: Segments }
            - { value: colorstopgradient, text: Gradient }

        - id: show-tickmarks
          type: toggle
          entity_index: show_tickmarks[0]
          xpos: 10
          ypos: calc(ypos_row_1)
          width: 11
          label:
            position: top
            gap: 1
            text: Ticks
            styles:
              font-size: 0.42em

        - id: show-labels
          type: toggle
          entity_index: show_labels[0]
          xpos: 30
          ypos: calc(ypos_row_1)
          width: 11
          label:
            position: top
            gap: 1
            text: Labels
            styles:
              font-size: 0.42em

        - id: show-label-badges
          type: toggle
          entity_index: show_label_badges[0]
          xpos: 50
          ypos: calc(ypos_row_1)
          width: 11
          label:
            position: top
            gap: 1
            text: Badges
            styles:
              font-size: 0.42em

        - id: show-tick-background
          type: toggle
          entity_index: show_tick_background[0]
          xpos: 70
          ypos: calc(ypos_row_1)
          width: 11
          label:
            position: top
            gap: 1
            text: Tick BG
            styles:
              font-size: 0.42em

        - id: show-background
          type: toggle
          entity_index: show_background[0]
          xpos: 90
          ypos: calc(ypos_row_1)
          width: 11
          label:
            position: top
            gap: 1
            text: Gauge BG
            styles:
              font-size: 0.42em

        - id: gauge-background-style
          type: select
          entity_index: background_style[0]
          xpos: 58
          ypos: calc(ypos_row_4)
          width: calc(select_width)
          height: 9
          label:
            position: start
            gap: 3
            text: Gauge BG
            styles:
              font-size: 0.48em
          content:
            mode: content_vertical
            content_vertical:
              text:
                styles:
                  font-size: 0.42em
          option_map:
            - { value: none, text: None }
            - { value: fixed, text: Fixed }
            - { value: colorstopsegments, text: Segments }
            - { value: colorstopgradient, text: Gradient }

        - id: scale-style
          type: select
          entity_index: scale_style[0]
          xpos: 58
          ypos: calc(ypos_row_5)
          width: calc(select_width)
          height: 9
          label:
            position: start
            gap: 3
            text: Scale BG
            styles:
              font-size: 0.48em
          content:
            mode: content_vertical
            content_vertical:
              text:
                styles:
                  font-size: 0.42em
          option_map:
            - { value: none, text: None }
            - { value: fixed, text: Fixed }
            - { value: colorstopsegments, text: Segments }
            - { value: colorstopgradient, text: Gradient }
            - { value: lineargradient, text: Linear }

        - id: labels-offset
          type: number
          entity_index: labels_offset[0]
          xpos: 32
          ypos: calc(ypos_row_6)
          width: 24
          height: 8
          show:
            item_style: outlined_round
          label:
            position: start
            gap: 3
            text: Labels
            styles:
              font-size: 0.52em

        - id: background-offset
          type: number
          entity_index: background_offset[0]
          xpos: 82
          ypos: calc(ypos_row_6)
          width: 24
          height: 8
          label:
            position: start
            gap: 3
            text: Gauge BG
            styles:
              font-size: 0.52em

        - id: ticks-offset
          type: number
          entity_index: ticks_offset[0]
          xpos: 32
          ypos: calc(ypos_row_7)
          width: 24
          height: 8
          label:
            position: start
            gap: 3
            text: Ticks
            styles:
              font-size: 0.52em

        - id: tick-background-offset
          type: number
          entity_index: tick_background_offset[0]
          xpos: 82
          ypos: calc(ypos_row_7)
          width: 24
          height: 8
          label:
            position: start
            gap: 3
            text: Tick BG
            styles:
              font-size: 0.52em

        - id: horseshoe-width
          type: number
          entity_index: horseshoe_width[0]
          xpos: 32
          ypos: calc(ypos_row_8)
          width: 24
          height: 8
          label:
            position: start
            gap: 3
            text: Horseshoe
            styles:
              font-size: 0.52em

        - id: scale-width
          type: number
          entity_index: scale_width[0]
          xpos: 82
          ypos: calc(ypos_row_8)
          width: 24
          height: 8
          label:
            position: start
            gap: 3
            text: Scale
            styles:
              font-size: 0.52em

        - id: major-ticks-width
          type: number
          entity_index: major_ticks_width[0]
          xpos: 32
          ypos: calc(ypos_row_9)
          width: 24
          height: 8
          label:
            position: start
            gap: 3
            text: Major width
            styles:
              font-size: 0.52em

        - id: minor-ticks-width
          type: number
          entity_index: minor_ticks_width[0]
          xpos: 82
          ypos: calc(ypos_row_9)
          width: 24
          height: 8
          label:
            position: start
            gap: 3
            text: Minor width
            styles:
              font-size: 0.52em

        - id: minor-ticks-offset
          type: number
          entity_index: minor_ticks_offset_delta[0]
          xpos: 55
          ypos: calc(ypos_row_10)
          width: 24
          height: 8
          label:
            position: start
            gap: 3
            text: Minor delta
            styles:
              font-size: 0.52em

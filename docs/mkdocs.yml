# History

# Project information
site_name: Flexible Horseshoe Card for Home Assistant
site_url: https://flexible-horseshoe-card-manual.amoebelabs.com/
site_author: Marco
site_description: >-
  Documentation for the Flexible Horseshoe Card, a configurable Home Assistant dashboard card for data-driven horseshoes, layouts, styling, animations, and reusable YAML.

# Repository
repo_name: Flexible Horseshoe Card
repo_url: https://github.com/amoebelabs/flex-horseshoe-card
edit_uri: ""

copyright: Copyright &copy; 2020-2027 Marco @AmoebeLabs

watch:
  - docs
  - docs/assets
  - overrides

theme:
  name: material
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: amoebelabs-light
      accent: amoebelabs-light
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      primary: amoebelabs-light
      accent: amoebelabs-light
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amoebelabs-dark
      accent: amoebelabs-dark
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  logo: assets/logo/fhs-logo.svg
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link

plugins:
  - search
  - tags
  # - blog
  - macros
  # Preserve indexed URLs when documentation pages move or are combined.
  - redirects:
      redirect_maps:
        "layout-overview/visual-shapes.md": "sections/visual-shapes-section.md"
        "sections/layout-overview/visual-shapes.md": "sections/visual-shapes-section.md"
        "sections/visual-shapes.md": "sections/visual-shapes-section.md"
        "sections/areas-section.md": "sections/entities-section.md"
        "sections/icons-section.md": "sections/entities-section.md"
        "sections/names-section.md": "sections/entities-section.md"
        "sections/states-section.md": "sections/entities-section.md"
        "sections/horseshoe-ticks.md": "sections/horseshoe-ticks-and-labels.md"
        "sections/horseshoe-labels.md": "sections/horseshoe-ticks-and-labels.md"
        "core-concepts/size-of-card.md": "core-concepts/card-structure.md"
        "reuse/reuse-introduction2.md": "reuse/reuse-introduction.md"
        "card-configuration/overview.md": "sections/layout-overview.md"
        "card-configuration/sections/layout-overview.md": "sections/layout-overview.md"
        "card-configuration/circles-section.md": "sections/visual-shapes-section.md"
        "card-configuration/hlines-section.md": "sections/visual-shapes-section.md"
        "card-configuration/vlines-section.md": "sections/visual-shapes-section.md"
        "card-configuration/sections/circles-section.md": "sections/visual-shapes-section.md"
        "card-configuration/sections/hlines-vlines-section.md": "sections/visual-shapes-section.md"
        "card-configuration/sections/hlines-section.md": "sections/visual-shapes-section.md"
        "card-configuration/sections/vlines-section.md": "sections/visual-shapes-section.md"
        "card-configuration/groups-section.md": "sections/groups-section.md"
        "card-configuration/positioning-and-groups.md": "core-concepts/positioning-and-groups.md"
        "card-configuration/entities-definition.md": "core-concepts/entity-definitions.md"
  - minify:
      minify_html: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js

extra:
  social:
    - icon: bmc/bmc-logo
      link: https://www.buymeacoffee.com/amoebelabs/
    - icon: amoebelabs/al-logo-social
      link: https://amoebelabs.com/
    - icon: m3/m3-logo-social
      link: https://material3-themes-manual.amoebelabs.com/
    - icon: fontawesome/brands/github
      link: https://github.com/amoebelabs/
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/amoebelabs/
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/amoebelabs/

  analytics:
    provider: google
    property: G-492WMK51S3

markdown_extensions:
  - admonition
  - abbr
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  # Formatting
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  # Grids
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-experimental
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true


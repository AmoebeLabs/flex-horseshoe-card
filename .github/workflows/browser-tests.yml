name: Browser geometry tests

on:
  pull_request:
    branches:
      - master
      - 568-horseshoe-v3-path-engine
  push:
    branches:
      - 568-horseshoe-v3-path-engine

jobs:
  svg-geometry:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:browser
